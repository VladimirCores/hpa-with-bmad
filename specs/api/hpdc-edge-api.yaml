openapi: 3.0.3
info:
  title: HPDC Edge API
  version: 1.0.0
  description: Source-of-truth contract for HPDC edge routes.
servers:
  - url: https://*.hpdc.local
paths:
  /api/welcome:
    get:
      summary: Returns a welcome counter value.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Welcome response
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
  /telemetry:
    post:
      summary: Ingest telemetry through the Pulsar edge.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Telemetry accepted
  /events:
    post:
      summary: Ingest event signals through the Kafka edge.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Event accepted
  /gql:
    post:
      summary: Query Hasura GraphQL endpoint.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: GraphQL response
securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
  apiKeyAuth:
    type: apiKey
    in: header
    name: X-API-Key
