apiVersion: v1
kind: Namespace
metadata:
  name: agent-engine
  labels:
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: ai-agent

---
apiVersion: hpdc.io/v1
kind: MCPToolRegistry
metadata:
  name: platform-capabilities-mcp-tools
  namespace: agent-engine
  labels:
    app.kubernetes.io/name: platform-capabilities-mcp-tools
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: ai-agent
spec:
  tools:
    query_databases: true
    call_apis: true
    trigger_workflows: true
  validation:
    security_policy: required
  logging:
    agent_id: required
    tool_name: required
  agents:
    - agent-1
    - agent-2

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-tool-definitions
  namespace: agent-engine
  labels:
    app.kubernetes.io/name: mcp-tool-definitions
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: ai-agent
data:
  tools.json: |
    {
      "tools": [
        {
          "name": "query_database",
          "description": "Query a platform database through the GraphQL gateway",
          "parameters": ["region", "database", "query"]
        },
        {
          "name": "call_api",
          "description": "Invoke a platform API endpoint",
          "parameters": ["method", "path", "body"]
        },
        {
          "name": "trigger_workflow",
          "description": "Trigger a Kargo or Argo Workflows pipeline",
          "parameters": ["workflow", "parameters"]
        }
      ]
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-security-policy
  namespace: agent-engine
  labels:
    app.kubernetes.io/name: mcp-security-policy
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: ai-agent
data:
  policy.yaml: |
    validation:
      security_policy: required
      allow_list:
        - query_database
        - call_api
        - trigger_workflow
      require_agent_id: true
      require_tool_name: true
      require_parameter_schema: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: agent-engine
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/component: mcp
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/hpdc/mcp-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /mcp/tools
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tool-definitions
              mountPath: /etc/mcp/tools
              readOnly: true
            - name: security-policy
              mountPath: /etc/mcp/policy
              readOnly: true
      volumes:
        - name: tool-definitions
          configMap:
            name: mcp-tool-definitions
        - name: security-policy
          configMap:
            name: mcp-security-policy

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: agent-engine
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: hpdc-platform
spec:
  selector:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-audit-log-config
  namespace: agent-engine
  labels:
    app.kubernetes.io/name: mcp-audit-log-config
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: ai-agent
data:
  audit.yaml: |
    log_fields:
      - agent_id
      - tool_name
      - parameters
      - result
    storage: vmlogs
