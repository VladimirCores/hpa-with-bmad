apiVersion: hpdc.io/v1
kind: AgentCommunication
metadata:
  name: authenticated-agent-communication
  namespace: agent-engine
  labels:
    app.kubernetes.io/name: authenticated-agent-communication
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: ai-agent
spec:
  registration:
    registered_agents_required: true
  channel:
    authenticated: true
  impersonation:
    unauthorized_prevented: true
    discovery: registered_agents_only

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-registry
  namespace: agent-engine
  labels:
    app.kubernetes.io/name: agent-registry
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: ai-agent
data:
  agents.yaml: |
    - name: agent-1
      id: agent-1@hpdc.local
      authenticated: true
      capabilities:
        - alert-analysis
        - entity-query
    - name: agent-2
      id: agent-2@hpdc.local
      authenticated: true
      capabilities:
        - telemetry-processing
        - workflow-trigger

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: a2a-messaging-config
  namespace: agent-engine
  labels:
    app.kubernetes.io/name: a2a-messaging-config
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: ai-agent
data:
  routing.yaml: |
    channel: authenticated
    require_registered_sender: true
    prevent_unauthorized_impersonation: true
    discovery: registered_agents_only
    transport: kafka
    topic: hpdc.agent.messages

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-broker
  namespace: agent-engine
  labels:
    app.kubernetes.io/name: a2a-broker
    app.kubernetes.io/component: a2a
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: a2a-broker
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a2a-broker
        app.kubernetes.io/component: a2a
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: a2a-broker
          image: ghcr.io/hpdc/a2a-broker:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /a2a/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: agent-registry
              mountPath: /etc/a2a/registry
              readOnly: true
            - name: messaging-config
              mountPath: /etc/a2a/config
              readOnly: true
      volumes:
        - name: agent-registry
          configMap:
            name: agent-registry
        - name: messaging-config
          configMap:
            name: a2a-messaging-config

---
apiVersion: v1
kind: Service
metadata:
  name: a2a-broker
  namespace: agent-engine
  labels:
    app.kubernetes.io/name: a2a-broker
    app.kubernetes.io/component: a2a
    app.kubernetes.io/part-of: hpdc-platform
spec:
  selector:
    app.kubernetes.io/name: a2a-broker
    app.kubernetes.io/component: a2a
  ports:
    - name: http
      port: 80
      targetPort: 8080
