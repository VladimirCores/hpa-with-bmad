apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: hpdc-platform
---
apiVersion: hpdc.io/v1
kind: AlertmanagerConfig
metadata:
  name: platform-alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: platform-alertmanager
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: monitoring
spec:
  routing:
    configured: true
  stale_metric_warning_minutes: 5
  channels:
    - name: platform-email
      type: email
      notify: oncall@hpdc.local
    - name: platform-webhook
      type: webhook
      url: https://alerts.hpdc.local/hook

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-routing
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-routing
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: monitoring
data:
  alertmanager.yaml: |
    route:
      receiver: platform-email
      group_by: [alertname, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: platform-webhook
    receivers:
      - name: platform-email
        email_configs:
          - to: oncall@hpdc.local
      - name: platform-webhook
        webhook_configs:
          - url: https://alerts.hpdc.local/hook

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stale-metric-warning
  namespace: monitoring
  labels:
    app.kubernetes.io/name: stale-metric-warning
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: monitoring
data:
  stale_metric_warning_minutes: "5"
  rules.yaml: |
    groups:
      - name: stale-metrics
        rules:
          - alert: StaleMetric
            expr: absent(up{job="platform"}) == 1
            for: 5m
            labels:
              severity: warning

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: hpdc-platform
        app.kubernetes.io/component: monitoring
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-routing

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: monitoring
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
