apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: core
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: hpdc-platform
  name: harbor-core
  namespace: harbor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: core
      app.kubernetes.io/name: harbor
  template:
    metadata:
      labels:
        app.kubernetes.io/component: core
        app.kubernetes.io/name: harbor
    spec:
      containers:
      - envFrom:
        - secretRef:
            name: harbor-dev-secrets
        - configMapRef:
            name: harbor-values
        image: goharbor/harbor-core:v2.15.2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /api/v2.0/ping
            port: core
          initialDelaySeconds: 30
          periodSeconds: 10
        name: core
        ports:
        - containerPort: 8080
          name: core
        readinessProbe:
          httpGet:
            path: /api/v2.0/ping
            port: core
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - mountPath: /etc/harbor/registry/config.yml
          name: config
          readOnly: true
          subPath: config.yml
        - mountPath: /etc/harbor/ca.crt
          name: config
          readOnly: true
          subPath: ca.crt
        - mountPath: /etc/harbor/config.yml
          name: config
          readOnly: true
          subPath: config.yml
        - mountPath: /var/lib/registry
          name: registry
      serviceAccountName: harbor
      volumes:
      - name: registry
        persistentVolumeClaim:
          claimName: harbor-core
      - configMap:
          name: harbor-config
          optional: true
        name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: jobservice
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: hpdc-platform
  name: harbor-jobservice
  namespace: harbor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: jobservice
      app.kubernetes.io/name: harbor
  template:
    metadata:
      labels:
        app.kubernetes.io/component: jobservice
        app.kubernetes.io/name: harbor
    spec:
      containers:
      - envFrom:
        - secretRef:
            name: harbor-dev-secrets
        - configMapRef:
            name: harbor-values
        image: goharbor/harbor-jobservice:v2.15.2
        imagePullPolicy: IfNotPresent
        name: jobservice
        ports:
        - containerPort: 8080
          name: jobservice
        readinessProbe:
          httpGet:
            path: /api/v1.0/ping
            port: jobservice
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - mountPath: /var/lib/jobservice
          name: jobservice
      serviceAccountName: harbor
      volumes:
      - name: jobservice
        persistentVolumeClaim:
          claimName: harbor-jobservice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: hpdc-platform
  name: harbor-postgresql
  namespace: harbor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgresql
      app.kubernetes.io/name: harbor
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgresql
        app.kubernetes.io/name: harbor
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: registry
        - name: POSTGRES_USER
          value: harbor
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgresPassword
              name: harbor-dev-secrets
        image: postgres:15.19-alpine
        imagePullPolicy: IfNotPresent
        name: postgresql
        ports:
        - containerPort: 5432
          name: postgresql
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: database
      serviceAccountName: harbor
      volumes:
      - name: database
        persistentVolumeClaim:
          claimName: harbor-postgresql
---
