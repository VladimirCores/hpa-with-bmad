apiVersion: v1
kind: ConfigMap
metadata:
  name: preload-images-job-config
  namespace: harbor
  labels:
    app.kubernetes.io/name: preload-images-job-config
    app.kubernetes.io/part-of: hpdc-platform
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: preload-offline-image-cache
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: preload-offline-image-cache
        spec:
          restartPolicy: Never
          containers:
            - name: preload
              image: docker:29-cli
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -eu
                  echo "Preload offline image cache into Harbor from local manifest."
                  cat /offline-image-cache/images.yaml
                  echo "Harbor ingestion manifest recorded locally."
              volumeMounts:
                - name: offline-image-cache
                  mountPath: /offline-image-cache
                  readOnly: true
          volumes:
            - name: offline-image-cache
              configMap:
                name: offline-image-cache
