apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-image-cache-refresh
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor-image-cache-refresh
    app.kubernetes.io/part-of: hpdc-platform
data:
  refresh.yaml: |
    images:
      - name: goharbor/harbor-core:v2.15.2
        source: output/harbor/images/harbor-core-v2.15.2
        digest: sha256:offline-core
        changed: false
      - name: goharbor/registry-photon:v2.15.2
        source: output/harbor/images/registry-photon-v2.15.2
        digest: sha256:offline-registry
        changed: false