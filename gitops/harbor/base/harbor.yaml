apiVersion: v1
kind: Namespace
metadata:
  name: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: Secret
metadata:
  name: harbor-dev-secrets
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: hpdc-platform
type: Opaque
stringData:
  adminPassword: HarborAdmin12345
  coreSecret: harbor-core-secret
  jobserviceSecret: harbor-jobservice-secret
  registrySecret: harbor-registry-secret
  trivyAdapterSecret: harbor-trivy-adapter-secret
  cosignVerificationSecret: harbor-cosign-verification-secret
  postgresPassword: HarborPostgres12345

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-values
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: hpdc-platform
data:
  harbor-values.yaml: |
    expose:
      type: service
      tls:
        certSource: none
    externalURL: http://harbor.harbor.svc.cluster.local
    secretkey: harbor-secretkey-for-offline-dev
    adminUser: admin
    adminPassword: HarborAdmin12345
    authMode: databaseAuth
    projectCreationRestriction: anyonewithaccount
    registryCredentialSecretName: harbor-dev-secrets
    registryStorageProviderName: local
registryStorageDeleteEnabled: true
storageClassName: rook-ceph-rbd
registryHttpSecret: HarborRegistryHttpSecret12345
    registryStorageGoogleCredentials: '{"type":"service_account","project_id":"hpdc-offline"}'
    trivy:
      enabled: true
      clair:
        enabled: true
      insecure: true
      ignoreUnfixed: false
      jobsInterval: 60m
      jvmGcMaxJobCount: 4
      jvmGcMemoryLimit: 512Mi
      scannerURL: http://harbor-trivy-adapter:8080
    cosign:
      signatureVerification: true
      verifyPullSignatures: true
    chartRepository:
      enabled: true
      storageProviderName: local
      jobsInterval: 60m
    persistence:
      enabled: true
      persistentVolumeClaim:
        registry:
          pvcStorageClassName: rook-ceph-rbd
          storageClass: rook-ceph-rbd
          accessModes:
            - ReadWriteOnce
          size: 20Gi
        database:
          pvcStorageClassName: rook-ceph-rbd
          storageClass: rook-ceph-rbd
          accessModes:
            - ReadWriteOnce
          size: 10Gi
        redis:
          pvcStorageClassName: rook-ceph-rbd
          storageClass: rook-ceph-rbd
          accessModes:
            - ReadWriteOnce
          size: 10Gi
        jobservice:
          pvcStorageClassName: rook-ceph-rbd
          storageClass: rook-ceph-rbd
          accessModes:
            - ReadWriteOnce
          size: 10Gi
        trivy:
          pvcStorageClassName: rook-ceph-rbd
          storageClass: rook-ceph-rbd
          accessModes:
            - ReadWriteOnce
          size: 10Gi
        chartmuseum:
          pvcStorageClassName: rook-ceph-rbd
          storageClass: rook-ceph-rbd
          accessModes:
            - ReadWriteOnce
          size: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-core
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: core
    spec:
      serviceAccountName: harbor
      containers:
        - name: core
          image: harbor/harbor-core:v2.11.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: harbor-dev-secrets
            - configMapRef:
                name: harbor-values
          ports:
            - name: core
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v2.0/ping
              port: core
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v2.0/ping
              port: core
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/harbor/registry/config.yml
              subPath: config.yml
              readOnly: true
            - name: config
              mountPath: /etc/harbor/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: config
              mountPath: /etc/harbor/config.yml
              subPath: config.yml
              readOnly: true
            - name: registry
              mountPath: /var/lib/registry

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-jobservice
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: jobservice
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: jobservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: jobservice
    spec:
      serviceAccountName: harbor
      containers:
        - name: jobservice
          image: harbor/harbor-jobservice:v2.11.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: harbor-dev-secrets
            - configMapRef:
                name: harbor-values
          ports:
            - name: jobservice
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v1.0/ping
              port: jobservice
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: jobservice
              mountPath: /var/lib/jobservice

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-registry
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: registry
    spec:
      serviceAccountName: harbor
      containers:
        - name: registry
          image: harbor/harbor-registry:v2.11.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: harbor-dev-secrets
            - configMapRef:
                name: harbor-values
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: registry
              mountPath: /var/lib/registry

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-trivy-adapter
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: trivy-adapter
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: trivy-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: trivy-adapter
    spec:
      serviceAccountName: harbor
      containers:
        - name: trivy-adapter
          image: harbor/harbor-trivy-adapter:v2.11.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: harbor-dev-secrets
            - configMapRef:
                name: harbor-values
          ports:
            - name: trivy
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: trivy
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-chartmuseum
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: chartmuseum
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: chartmuseum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: chartmuseum
    spec:
      serviceAccountName: harbor
      containers:
        - name: chartmuseum
          image: harbor/harbor-chartmuseum:v2.11.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: harbor-dev-secrets
            - configMapRef:
                name: harbor-values
          ports:
            - name: chartmuseum
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: chartmuseum
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: chartmuseum
              mountPath: /var/lib/chartmuseum

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-redis
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: redis
    spec:
      serviceAccountName: harbor
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis
              mountPath: /data

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-postgresql
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: postgresql
    spec:
      serviceAccountName: harbor
      containers:
        - name: postgresql
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: registry
            - name: POSTGRES_USER
              value: harbor
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-dev-secrets
                  key: postgresPassword
          ports:
            - name: postgresql
              containerPort: 5432
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: Service
metadata:
  name: harbor
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: hpdc-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: core
  ports:
    - name: http
      port: 80
      targetPort: core

---
apiVersion: v1
kind: Service
metadata:
  name: harbor-registry
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: hpdc-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
