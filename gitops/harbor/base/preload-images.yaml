apiVersion: v1
kind: ConfigMap
metadata:
  name: offline-image-cache
  namespace: harbor
  labels:
    app.kubernetes.io/name: offline-image-cache
    app.kubernetes.io/part-of: hpdc-platform
data:
  images.yaml: |
    offline: true
    images:
      - name: goharbor/harbor-core:v2.15.2
        source: output/harbor/images/harbor-core-v2.15.2
        target: harbor.local/goharbor/harbor-core:v2.15.2
      - name: goharbor/registry-photon:v2.15.2
        source: output/harbor/images/registry-photon-v2.15.2
        target: harbor.local/goharbor/registry-photon:v2.15.2
      - name: goharbor/harbor-jobservice:v2.15.2
        source: output/harbor/images/harbor-jobservice-v2.15.2
        target: harbor.local/goharbor/harbor-jobservice:v2.15.2
      - name: goharbor/trivy-adapter-photon:v2.15.2
        source: output/harbor/images/trivy-adapter-photon-v2.15.2
        target: harbor.local/goharbor/trivy-adapter-photon:v2.15.2

---
apiVersion: batch/v1
kind: Job
metadata:
  name: preload-offline-image-cache
  namespace: harbor
  labels:
    app.kubernetes.io/name: preload-offline-image-cache
    app.kubernetes.io/part-of: hpdc-platform
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preload-offline-image-cache
    spec:
      restartPolicy: Never
      containers:
        - name: preload
          image: docker:29-cli
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Preload offline image cache into Harbor from local manifest."
              cat /offline-image-cache/images.yaml
              echo "Harbor ingestion manifest recorded locally."
          volumeMounts:
            - name: offline-image-cache
              mountPath: /offline-image-cache
              readOnly: true
      volumes:
        - name: offline-image-cache
          configMap:
            name: offline-image-cache
