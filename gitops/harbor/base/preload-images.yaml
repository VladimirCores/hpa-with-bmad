apiVersion: v1
kind: ConfigMap
metadata:
  name: offline-image-cache
  namespace: harbor
  labels:
    app.kubernetes.io/name: offline-image-cache
    app.kubernetes.io/part-of: hpdc-platform
data:
  images.yaml: |
    offline: true
    images:
      - name: harbor/harbor-core:v2.11.3
        source: output/harbor/images/harbor-core-v2.11.3
        target: harbor.local/harbor/harbor-core:v2.11.3
      - name: harbor/harbor-registry:v2.11.3
        source: output/harbor/images/harbor-registry-v2.11.3
        target: harbor.local/harbor/harbor-registry-v2.11.3
      - name: harbor/harbor-jobservice:v2.11.3
        source: output/harbor/images/harbor-jobservice-v2.11.3
        target: harbor.local/harbor/harbor-jobservice-v2.11.3
      - name: harbor/harbor-trivy-adapter:v2.11.3
        source: output/harbor/images/harbor-trivy-adapter-v2.11.3
        target: harbor.local/harbor/harbor-trivy-adapter:v2.11.3
      - name: harbor/harbor-chartmuseum:v2.11.3
        source: output/harbor/images/harbor-chartmuseum-v2.11.3
        target: harbor.local/harbor/harbor-chartmuseum-v2.11.3


---
apiVersion: batch/v1
kind: Job
metadata:
  name: preload-offline-image-cache
  namespace: harbor
  labels:
    app.kubernetes.io/name: preload-offline-image-cache
    app.kubernetes.io/part-of: hpdc-platform
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preload-offline-image-cache
    spec:
      restartPolicy: Never
      containers:
        - name: preload
          image: docker:2.41-cli
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Preload offline image cache into Harbor from local manifest."
              cat /offline-image-cache/images.yaml
              echo "Harbor ingestion manifest recorded locally."
          volumeMounts:
            - name: offline-image-cache
              mountPath: /offline-image-cache
              readOnly: true
      volumes:
        - name: offline-image-cache
          configMap:
            name: offline-image-cache
