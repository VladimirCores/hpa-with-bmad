apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/part-of: hpdc-platform
  name: infisical
---
apiVersion: v1
data:
  infisical-config.yaml: |
    secretRotation:
      enabled: true
      rotationIntervalDays: 90
    auditLog:
      enabled: true
    operator:
      enabled: true
    csiDriver:
      enabled: true
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: infisical-config
    app.kubernetes.io/part-of: hpdc-platform
  name: infisical-config
  namespace: infisical
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/name: infisical
    app.kubernetes.io/part-of: hpdc-platform
  name: infisical
  namespace: infisical
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/name: infisical
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: infisical-postgres
    app.kubernetes.io/part-of: hpdc-platform
  name: infisical-postgres
  namespace: infisical
spec:
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
  selector:
    app.kubernetes.io/name: infisical-postgres
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: infisical-redis
    app.kubernetes.io/part-of: hpdc-platform
  name: infisical-redis
  namespace: infisical
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: redis
  selector:
    app.kubernetes.io/name: infisical-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/name: infisical
    app.kubernetes.io/part-of: hpdc-platform
  name: infisical
  namespace: infisical
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: secrets
      app.kubernetes.io/name: infisical
  template:
    metadata:
      labels:
        app.kubernetes.io/component: secrets
        app.kubernetes.io/name: infisical
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
      - command:
        - node
        - --enable-source-maps
        - /backend/dist/main.mjs
        env:
        - name: DB_HOST
          value: infisical-postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: infisical
        - name: DB_USER
          value: infisical
        - name: DB_PASSWORD
          value: InfisicalAdmin12345
        - name: REDIS_URL
          value: redis://infisical-redis:6379
        - name: BASE_URL
          value: http://infisical.infisical.svc.cluster.local
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: encryptionKey
              name: infisical-secrets
        - name: ROOT_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: rootEncryptionKey
              name: infisical-secrets
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              key: authSecret
              name: infisical-secrets
        image: docker.io/infisical/infisical:v0.162.24
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 30
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 120
          periodSeconds: 20
          timeoutSeconds: 8
        name: infisical
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 8
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
      volumes:
      - configMap:
          name: infisical-config
        name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: infisical-postgres
    app.kubernetes.io/part-of: hpdc-platform
  name: infisical-postgres
  namespace: infisical
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infisical-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infisical-postgres
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: infisical
        - name: POSTGRES_USER
          value: infisical
        - name: POSTGRES_PASSWORD
          value: InfisicalAdmin12345
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: docker.io/library/postgres:15.19-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - psql
            - -U
            - infisical
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - psql
            - -U
            - infisical
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: infisical-redis
    app.kubernetes.io/part-of: hpdc-platform
  name: infisical-redis
  namespace: infisical
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infisical-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infisical-redis
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
      - args:
        - redis-server
        - --appendonly
        - "no"
        image: docker.io/library/redis:8.2.8-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 6
          periodSeconds: 8
          timeoutSeconds: 5
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  labels:
    app.kubernetes.io/name: hpdc-production-secrets
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-production-secrets
  namespace: infisical
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        envSlug: dev
        projectSlug: hpdc
        secretsPath: /
  hostAPI: http://infisical.infisical.svc.cluster.local/api
  managedKubeSecretReferences:
  - creationPolicy: Orphan
    secretName: hpdc-prod-credentials
    secretNamespace: infisical
  syncConfig:
    instantUpdates: false
    resyncInterval: 60s
