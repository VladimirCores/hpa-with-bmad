apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: hpdc-production-secrets
  namespace: infisical
  labels:
    app.kubernetes.io/name: hpdc-production-secrets
    app.kubernetes.io/part-of: hpdc-platform
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local/api
  syncConfig:
    resyncInterval: 60s
    instantUpdates: false
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: hpdc
        envSlug: production
        secretsPath: "/"
      credentialsRef:
        secretName: infisical-universal-auth-credentials
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: hpdc-prod-credentials
      secretNamespace: infisical
      creationPolicy: Orphan
