apiVersion: v1
kind: Namespace
metadata:
  name: infisical
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: infisical-config
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical-config
    app.kubernetes.io/part-of: hpdc-platform
data:
  infisical-config.yaml: |
    secretRotation:
      enabled: true
      rotationIntervalDays: 90
    auditLog:
      enabled: true
    operator:
      enabled: true
    csiDriver:
      enabled: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infisical
      app.kubernetes.io/component: secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infisical
        app.kubernetes.io/component: secrets
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: infisical
          image: docker.io/infisical/infisical:v0.162.24
          imagePullPolicy: IfNotPresent
          args:
            - --configPath
            - /config/infisical-config.yaml
          env:
            - name: INFISICAL_DATABASE_HOST
              value: infisical-postgres
            - name: INFISICAL_DATABASE_PORT
              value: "5432"
            - name: INFISICAL_DATABASE_NAME
              value: infisical
            - name: INFISICAL_DATABASE_USER
              value: infisical
            - name: INFISICAL_DATABASE_PASSWORD
              value: InfisicalAdmin12345
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: infisical-config

---
apiVersion: v1
kind: Service
metadata:
  name: infisical
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: hpdc-platform
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/component: secrets
