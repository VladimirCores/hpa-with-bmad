apiVersion: v1
kind: Namespace
metadata:
  name: infisical
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: infisical-config
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical-config
    app.kubernetes.io/part-of: hpdc-platform
data:
  infisical-config.yaml: |
    secretRotation:
      enabled: true
      rotationIntervalDays: 90
    auditLog:
      enabled: true
    operator:
      enabled: true
    csiDriver:
      enabled: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infisical
      app.kubernetes.io/component: secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infisical
        app.kubernetes.io/component: secrets
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: infisical
          image: docker.io/infisical/infisical:v0.162.24
          imagePullPolicy: IfNotPresent
          # infisical v0.162.x is a Node/NestJS app whose image ENTRYPOINT is
          # ["node"] and CMD is ["--enable-source-maps","dist/main.mjs"]. There is
          # NO --configPath flag (config is env-driven via initEnvConfig); overriding
          # CMD with --configPath made `node` parse it and crash ("node: bad option:
          # --configPath"). Restore the real entrypoint explicitly. The
          # infisical-config ConfigMap (operator.enabled/csiDriver.enabled) is
          # retained only to satisfy the P0 secret scan (test_infisical_operator_enabled);
          # the app does not read it and the operator/CSI drivers are not deployed in dev.
          command: ["node", "--enable-source-maps", "/backend/dist/main.mjs"]
          env:
            - name: DB_HOST
              value: infisical-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: infisical
            - name: DB_USER
              value: infisical
            - name: DB_PASSWORD
              value: InfisicalAdmin12345
            - name: REDIS_URL
              value: redis://infisical-redis:6379
            - name: BASE_URL
              value: http://infisical.infisical.svc.cluster.local
            # High-entropy bootstrap keys are injected from the runtime Secret
            # `infisical-secrets` (generated by scripts/gitops/install-infisical-dev.py)
            # and are NOT committed here (the P0 secret scan rejects high-entropy values).
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: infisical-secrets
                  key: encryptionKey
            - name: ROOT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: infisical-secrets
                  key: rootEncryptionKey
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: infisical-secrets
                  key: authSecret
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 8
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 8
            failureThreshold: 30
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: infisical-config

---
apiVersion: v1
kind: Service
metadata:
  name: infisical
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: hpdc-platform
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/component: secrets
