---
# dev-only postgres backing the infisical self-hosted app. The image is mirrored
# on the offline registry (see scripts/gitops/component_versions.py — Harbor pins
# the same 15.19-alpine tag). Password is the whitelisted dev bootstrap value
# (InfisicalAdmin12345) — the P0 secret scan explicitly allows it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical-postgres
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical-postgres
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infisical-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infisical-postgres
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:15.19-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: infisical
            - name: POSTGRES_USER
              value: infisical
            - name: POSTGRES_PASSWORD
              value: InfisicalAdmin12345
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [psql, -U, infisical]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [psql, -U, infisical]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: infisical-postgres
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical-postgres
    app.kubernetes.io/part-of: hpdc-platform
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: infisical-postgres
