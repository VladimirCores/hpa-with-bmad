---
# dev-only redis backing the infisical self-hosted app (required for sessions
# and the internal cache — infisical refuses to boot without REDIS_URL). Image is
# mirrored on the offline registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical-redis
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical-redis
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infisical-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infisical-redis
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:8.2.8-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 6
            periodSeconds: 8
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: infisical-redis
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical-redis
    app.kubernetes.io/part-of: hpdc-platform
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: infisical-redis
