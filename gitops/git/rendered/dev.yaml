apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: git-mirror
    app.kubernetes.io/part-of: hpdc-platform
  name: git-mirror
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: git-mirror
    app.kubernetes.io/part-of: hpdc-platform
  name: git-mirror
  namespace: git-mirror
spec:
  ports:
  - name: git
    port: 9418
    targetPort: git
  selector:
    app.kubernetes.io/name: git-mirror
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/name: git-mirror
    app.kubernetes.io/part-of: hpdc-platform
  name: git-mirror-data
  namespace: git-mirror
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: rook-ceph-rbd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: git-mirror
    app.kubernetes.io/part-of: hpdc-platform
  name: git-mirror
  namespace: git-mirror
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-mirror
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          mkdir -p /data
          echo "Offline Git mirror placeholder" > /data/README.md
        image: alpine/git:2.45.2
        imagePullPolicy: IfNotPresent
        name: git
        ports:
        - containerPort: 9418
          name: git
        volumeMounts:
        - mountPath: /data
          name: data
