apiVersion: v1
kind: Namespace
metadata:
  name: git-mirror
  labels:
    app.kubernetes.io/name: git-mirror
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-mirror-data
  namespace: git-mirror
  labels:
    app.kubernetes.io/name: git-mirror
    app.kubernetes.io/part-of: hpdc-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-rbd
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-mirror
  namespace: git-mirror
  labels:
    app.kubernetes.io/name: git-mirror
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-mirror
    spec:
      containers:
        - name: git
          image: alpine/git:2.54.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /data
              echo "Offline Git mirror placeholder" > /data/README.md
          ports:
            - name: git
              containerPort: 9418
          volumeMounts:
            - name: data
              mountPath: /data

---
apiVersion: v1
kind: Service
metadata:
  name: git-mirror
  namespace: git-mirror
  labels:
    app.kubernetes.io/name: git-mirror
    app.kubernetes.io/part-of: hpdc-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: git-mirror
  ports:
    - name: git
      port: 9418
      targetPort: git