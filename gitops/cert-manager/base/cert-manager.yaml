apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-cainjector
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cainjector
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
rules:
  - apiGroups:
      - cert-manager.io
    resources:
      - certificaterequests
      - certificates
      - issuers
      - clusterissuers
      - challenges
      - orders
      - challenges
      - orders
      - certificatesigningrequests
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - cert-manager.io
    resources:
      - issuers/status
      - clusterissuers/status
    verbs:
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
      - events
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - update
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
  - kind: ServiceAccount
    name: cert-manager-cainjector
    namespace: cert-manager
  - kind: ServiceAccount
    name: cert-manager-webhook
    namespace: cert-manager

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      serviceAccountName: cert-manager
      containers:
        - name: cert-manager
          image: quay.io/jetstack/cert-manager-controller:v1.18.2
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=false
            - --v=2
          env:
            - name: ENABLE_CERTIFICATE_ISSUER
              value: "true"
            - name: ENABLE_CERTIFICATE_REQUEST_ISSUER
              value: "true"
            - name: ENABLE_ORDER_ISSUER
              value: "true"
            - name: ENABLE_CLUSTER_ISSUER
              value: "true"
            - name: ENABLE_WEBHOOK
              value: "true"
            - name: ENABLE_CAINJECTOR
              value: "true"
          ports:
            - name: http
              containerPort: 9402
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/component: webhook
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      serviceAccountName: cert-manager-webhook
      containers:
        - name: cert-manager-webhook
          image: quay.io/jetstack/cert-manager-webhook:v1.18.2
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=10250
            - --v=2
          ports:
            - name: https
              containerPort: 10250
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-cainjector
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cainjector
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: cainjector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/component: cainjector
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      serviceAccountName: cert-manager-cainjector
      containers:
        - name: cert-manager-cainjector
          image: quay.io/jetstack/cert-manager-cainjector:v1.18.2
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
          ports:
            - name: http
              containerPort: 9402
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: hpdc-platform
spec:
  ports:
    - name: https
      port: 443
      targetPort: 10250
  selector:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: webhook

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: hpdc-selfsigned
  labels:
    app.kubernetes.io/name: hpdc-selfsigned
    app.kubernetes.io/part-of: hpdc-platform
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hpdc-edge-tls
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: hpdc-edge-tls
    app.kubernetes.io/part-of: hpdc-platform
spec:
  secretName: hpdc-edge-tls
  commonName: "*.hpdc.local"
  dnsNames:
    - "*.hpdc.local"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: hpdc-selfsigned
  secretTemplate:
    labels:
      app.kubernetes.io/name: hpdc-edge-tls
      app.kubernetes.io/part-of: hpdc-platform
