apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
  name: cert-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
  name: cert-manager
  namespace: cert-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: cainjector
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
  name: cert-manager-cainjector
  namespace: cert-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
  name: cert-manager-webhook
  namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
  name: cert-manager
rules:
- apiGroups:
  - cert-manager.io
  resources:
  - certificaterequests
  - certificates
  - issuers
  - clusterissuers
  - challenges
  - orders
  - challenges
  - orders
  - certificatesigningrequests
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - issuers/status
  - clusterissuers/status
  verbs:
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  - events
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingwebhookconfigurations
  - mutatingwebhookconfigurations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
  name: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: cert-manager
- kind: ServiceAccount
  name: cert-manager-cainjector
  namespace: cert-manager
- kind: ServiceAccount
  name: cert-manager-webhook
  namespace: cert-manager
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  ports:
  - name: https
    port: 443
    targetPort: 10250
  selector:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/name: cert-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
  name: cert-manager
  namespace: cert-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: cert-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
      - args:
        - --leader-elect=false
        - --v=2
        env:
        - name: ENABLE_CERTIFICATE_ISSUER
          value: "true"
        - name: ENABLE_CERTIFICATE_REQUEST_ISSUER
          value: "true"
        - name: ENABLE_ORDER_ISSUER
          value: "true"
        - name: ENABLE_CLUSTER_ISSUER
          value: "true"
        - name: ENABLE_WEBHOOK
          value: "true"
        - name: ENABLE_CAINJECTOR
          value: "true"
        image: quay.io/jetstack/cert-manager-controller:v1.21.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        name: cert-manager
        ports:
        - containerPort: 9402
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
      serviceAccountName: cert-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: cainjector
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
  name: cert-manager-cainjector
  namespace: cert-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: cainjector
      app.kubernetes.io/name: cert-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cainjector
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
      - args:
        - --v=2
        image: quay.io/jetstack/cert-manager-cainjector:v1.21.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        name: cert-manager-cainjector
        ports:
        - containerPort: 9402
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
      serviceAccountName: cert-manager-cainjector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: hpdc-platform
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: webhook
      app.kubernetes.io/name: cert-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: webhook
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
      - args:
        - --secure-port=10250
        - --v=2
        image: quay.io/jetstack/cert-manager-webhook:v1.21.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
          initialDelaySeconds: 20
          periodSeconds: 20
        name: cert-manager-webhook
        ports:
        - containerPort: 10250
          name: https
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
          initialDelaySeconds: 5
          periodSeconds: 10
      serviceAccountName: cert-manager-webhook
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/name: hpdc-edge-tls
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-edge-tls
  namespace: envoy-gateway-system
spec:
  commonName: '*.hpdc.local'
  dnsNames:
  - '*.hpdc.local'
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: hpdc-selfsigned
  secretName: hpdc-edge-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: hpdc-edge-tls
      app.kubernetes.io/part-of: hpdc-platform
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  labels:
    app.kubernetes.io/name: hpdc-selfsigned
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-selfsigned
spec:
  selfSigned: {}
