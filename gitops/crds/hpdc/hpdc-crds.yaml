# HPDC platform CRDs (hpdc.io/v1) — structural schemas tightened.
# Ground truth: live spec fields used across gitops/{platform,alerts,agent-engine,
# entity-store,monitoring,observability,regional-hub,regional-sovereignty,
# victoria-metrics,clustermesh}/base/*.yaml (source of truth, NOT SOLUTION-DESIGN.md).
# All CRDs are Namespaced; CRs live in per-component namespaces.
# NOTE: 26 kinds are instantiated across the tree; this bundle defines all 26,
# including alertmanagerconfigs.hpdc.io (the 26th kind observed in
# gitops/monitoring/base/alertmanager.yaml — previously instantiated with no CRD).
# x-kubernetes-preserve-unknown-fields is used ONLY where a config map carries
# free-form/single-key-pair payloads that a strict schema cannot enumerate.
---

