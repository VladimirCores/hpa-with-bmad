    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
              - default_action
            properties:
              workflows:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - name
                    - trigger
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                    trigger:
                      type: object
                      required:
                        - alert_type
                        - severity
                      properties:
                        alert_type:
                          type: string
                        severity:
                          type: string
                        cooldown_minutes:
                          type: integer
                    actions:
                      type: array
                      items:
                        type: object
                        required:
                          - type
                        properties:
                          type:
                            type: string
                            enum:
                              - restart_deployment
                              - delete_pod
                              - scale_deployment
                              - increase_hpa_target
                              - notify
                          target_selector:
                            type: string
                          namespace:
                            type: string
                          metric:
                            type: string
                          adjustment:
                            type: string
                          max_replicas:
                            type: integer
                          node:
                            type: string
                    conditions:
                      type: array
                      items:
                        type: string
                    batch_size:
                      type: integer
                    on_success:
                      type: array
                      items:
                        # Single-key-pair entries (e.g. update_alert: {state, reason})
                        # with variant keys per action type — declare open.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    on_failure:
                      type: array
                      items:
                        # Single-key-pair entries (e.g. notification / fallback_action)
                        # with variant keys per action type — declare open.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
              default_action:
                type: string
              notification_templates:
                type: object
                additionalProperties:
                  type: string
