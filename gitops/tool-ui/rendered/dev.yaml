apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gateway.envoyproxy.io/casbin-enforced: "false"
    gateway.envoyproxy.io/native-auth: "true"
  labels:
    app.kubernetes.io/name: hpdc-edge-tool-ui-routes
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-edge-tool-ui-routes
  namespace: envoy-gateway-system
spec:
  hostnames:
  - '*.hpdc.local'
  parentRefs:
  - name: hpdc-edge
    sectionName: https
  rules:
  - backendRefs:
    - kind: Service
      name: backstage
      port: 80
      weight: 1
    filters:
    - requestRedirect:
        port:
          number: 443
        scheme: https
      type: RequestRedirect
    matches:
    - path:
        type: PathPrefix
        value: /
  - backendRefs:
    - kind: Service
      name: argocd-server
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /argocd
  - backendRefs:
    - kind: Service
      name: kargo-ui
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /kargo
