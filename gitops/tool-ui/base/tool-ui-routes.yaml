apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hpdc-edge-tool-ui-routes
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: hpdc-edge-tool-ui-routes
    app.kubernetes.io/part-of: hpdc-platform
  annotations:
    gateway.envoyproxy.io/native-auth: "true"
    gateway.envoyproxy.io/casbin-enforced: "false"
spec:
  parentRefs:
    - name: hpdc-edge
      sectionName: https
  hostnames:
    - "*.hpdc.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port:
              number: 443
      backendRefs:
        - name: backstage
          port: 80
          kind: Service
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /argocd
      backendRefs:
        - name: argocd-server
          port: 80
          kind: Service
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /kargo
      backendRefs:
        - name: kargo-ui
          port: 8080
          kind: Service
          weight: 1
