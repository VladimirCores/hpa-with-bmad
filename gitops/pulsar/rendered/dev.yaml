---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: pulsar-standalone
    app.kubernetes.io/part: pulsar
    environment: dev
  name: pulsar-standalone
  namespace: pulsar
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  - name: broker
    port: 6650
    protocol: TCP
    targetPort: 6650
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: pulsar-standalone
    environment: dev
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/name: pulsar-standalone
    app.kubernetes.io/part: pulsar
    environment: dev
  name: pulsar-data
  namespace: pulsar
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: pulsar-resources-operator
    app.kubernetes.io/part: pulsar
    environment: dev
  name: pulsar-resources-operator
  namespace: pulsar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsar-resources-operator
      environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsar-resources-operator
        environment: dev
    spec:
      containers:
      - args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=0.0.0.0:8443
        - --leader-elect
        - --resync-period=10
        - --retry-count=5
        command:
        - /manager
        image: docker.io/streamnative/pulsar-resources-operator:v0.21.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8443
          name: metrics
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      serviceAccountName: pulsar-resources-operator
      terminationGracePeriodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: pulsar-standalone
    app.kubernetes.io/part: pulsar
    environment: dev
  name: pulsar-standalone
  namespace: pulsar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsar-standalone
      environment: dev
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsar-standalone
        environment: dev
    spec:
      containers:
      - args:
        - |
          bin/pulsar standalone \
            --advertised-address pulsar-standalone.pulsar.svc.cluster.local \
            --no-functions-worker
        command:
        - /bin/bash
        - -c
        env:
        - name: PULSAR_MEM
          value: -Xms512m -Xmx1024m
        image: docker.io/apachepulsar/pulsar:4.2.4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /admin/v2/brokers/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        name: pulsar-standalone
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 6650
          name: broker
          protocol: TCP
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /admin/v2/brokers/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          limits:
            cpu: "2"
            memory: 2048Mi
          requests:
            cpu: 250m
            memory: 1Gi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /admin/v2/brokers/health
            port: 8080
          periodSeconds: 10
        volumeMounts:
        - mountPath: /pulsar/data
          name: data
      hostname: pulsar-standalone
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pulsar-data
