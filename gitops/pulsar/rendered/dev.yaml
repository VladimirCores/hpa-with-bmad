kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: pulsar-resources-operator
    app.kubernetes.io/part: pulsar
    environment: dev
  name: pulsar-resources-operator-manager-rolebinding
roleRef:
