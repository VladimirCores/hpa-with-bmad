apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulsar-data
  namespace: pulsar
  labels:
    app.kubernetes.io/name: pulsar-standalone
    app.kubernetes.io/part: pulsar
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pulsar-standalone
  namespace: pulsar
  labels:
    app.kubernetes.io/name: pulsar-standalone
    app.kubernetes.io/part: pulsar
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: pulsar-standalone
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: broker
      port: 6650
      targetPort: 6650
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar-standalone
  namespace: pulsar
  labels:
    app.kubernetes.io/name: pulsar-standalone
    app.kubernetes.io/part: pulsar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsar-standalone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsar-standalone
    spec:
      hostname: pulsar-standalone
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pulsar-standalone
          image: docker.io/apachepulsar/pulsar:4.2.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -c
          args:
            - |
              bin/pulsar standalone \
                --advertised-address pulsar-standalone.pulsar.svc.cluster.local \
                --no-functions-worker
          env:
            - name: PULSAR_MEM
              value: "-Xms512m -Xmx1024m"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: broker
              containerPort: 6650
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /pulsar/data
          startupProbe:
            httpGet:
              path: /admin/v2/brokers/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /admin/v2/brokers/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /admin/v2/brokers/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2048Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pulsar-data