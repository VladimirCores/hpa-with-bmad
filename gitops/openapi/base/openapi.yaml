apiVersion: v1
kind: Namespace
metadata:
  name: swagger-ui
  labels:
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swagger-ui-config
  namespace: swagger-ui
  labels:
    app.kubernetes.io/name: swagger-ui-config
    app.kubernetes.io/part-of: hpdc-platform
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>HPDC OpenAPI</title></head>
      <body><h1>HPDC OpenAPI</h1><p>Source contract: specs/api/hpdc-edge-api.yaml</p></body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-ui
  namespace: swagger-ui
  labels:
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/component: docs
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swagger-ui
      app.kubernetes.io/component: docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swagger-ui
        app.kubernetes.io/component: docs
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: swagger-ui
          image: docker.io/swaggerapi/swagger-ui:v5.32.14
          imagePullPolicy: IfNotPresent
          args:
            - --configUrl=/openapi.json
            - --url=/openapi.json
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: swagger-ui
  namespace: swagger-ui
  labels:
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/component: docs
    app.kubernetes.io/part-of: hpdc-platform
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/component: docs
