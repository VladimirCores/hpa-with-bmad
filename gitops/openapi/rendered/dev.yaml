apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/part-of: hpdc-platform
  name: swagger-ui
---
apiVersion: v1
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>HPDC OpenAPI</title></head>
      <body><h1>HPDC OpenAPI</h1><p>Source contract: specs/api/hpdc-edge-api.yaml</p></body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: swagger-ui-config
    app.kubernetes.io/part-of: hpdc-platform
  name: swagger-ui-config
  namespace: swagger-ui
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: docs
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/part-of: hpdc-platform
  name: swagger-ui
  namespace: swagger-ui
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app.kubernetes.io/component: docs
    app.kubernetes.io/name: swagger-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: docs
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/part-of: hpdc-platform
  name: swagger-ui
  namespace: swagger-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: docs
      app.kubernetes.io/name: swagger-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/component: docs
        app.kubernetes.io/name: swagger-ui
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
      - args:
        - --configUrl=/openapi.json
        - --url=/openapi.json
        image: docker.io/swaggerapi/swagger-ui:v5.32.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        name: swagger-ui
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
