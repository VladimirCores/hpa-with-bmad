apiVersion: v1
kind: Namespace
metadata:
  name: casdoor
  labels:
    app.kubernetes.io/name: casdoor
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: casdoor-config
  namespace: casdoor
  labels:
    app.kubernetes.io/name: casdoor-config
    app.kubernetes.io/part-of: hpdc-platform
data:
  casdoor-config.toml: |
    appname = "casdoor"
    httpport = 8000
    runmode = "dev"
    copyrequestbody = true
    driverName = "postgres"
    dataSourceName = "user=casdoor password=casdoor host=casdoor-postgres port=5432 sslmode=disable dbname=casdoor"
    dbName = "casdoor"
    showSql = false
    providerName = "hpdc"
    providerDisplayName = "HPDC Casdoor"
    applicationName = "HPDC"
    applicationDisplayName = "HPDC"
    homeLink = "https://*.hpdc.local"
    appName = "HPDC"
    appTitle = "HPDC"
    logo = "/assets/hpdc-logo.png"
    origin = "https://casdoor.hpdc.local"
    serverURL = "https://*.hpdc.local"
    oidc = true
    saml = true
    refreshTokenExpireHours = 24
    sessionMaxLifetimeHours = 12

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor
  namespace: casdoor
  labels:
    app.kubernetes.io/name: casdoor
    app.kubernetes.io/component: authn
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: casdoor
      app.kubernetes.io/component: authn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casdoor
        app.kubernetes.io/component: authn
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: casdoor
          image: docker.io/casbin/casdoor:3.159.0
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /config/casdoor-config.toml
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CASDOOR_LOG_LEVEL
              value: debug
            - name: CASDOOR_ADMIN_PASSWORD
              value: CasdoorAdmin12345
          readinessProbe:
            httpGet:
              path: /api/v1/ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: casdoor-config

---
apiVersion: v1
kind: Service
metadata:
  name: casdoor
  namespace: casdoor
  labels:
    app.kubernetes.io/name: casdoor
    app.kubernetes.io/component: authn
    app.kubernetes.io/part-of: hpdc-platform
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8000
  selector:
    app.kubernetes.io/name: casdoor
    app.kubernetes.io/component: authn

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hpdc-casdoor-jwks
  namespace: casdoor
  labels:
    app.kubernetes.io/name: hpdc-casdoor-jwks
    app.kubernetes.io/component: authn
    app.kubernetes.io/part-of: hpdc-platform
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: hpdc-edge
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "casdoor.hpdc.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/jwks
      backendRefs:
        - group: ""
          kind: Service
          name: casdoor
          port: 80
          weight: 1
