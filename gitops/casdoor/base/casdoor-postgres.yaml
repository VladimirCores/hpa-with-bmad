apiVersion: v1
kind: Service
metadata:
  name: casdoor-postgres
  namespace: casdoor
  labels:
    app.kubernetes.io/name: casdoor-postgres
    app.kubernetes.io/part-of: hpdc-platform
spec:
  selector:
    app.kubernetes.io/name: casdoor-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: casdoor-postgres
  namespace: casdoor
  labels:
    app.kubernetes.io/name: casdoor-postgres
    app.kubernetes.io/part-of: hpdc-platform
spec:
  serviceName: casdoor-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: casdoor-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casdoor-postgres
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:15.19-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: casdoor
            - name: POSTGRES_PASSWORD
              value: casdoor
            - name: POSTGRES_DB
              value: casdoor
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}