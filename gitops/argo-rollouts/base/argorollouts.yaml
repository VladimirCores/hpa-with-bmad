apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-rollouts
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: hpdc-platform
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/status", "rollouts/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["analysisruns", "analysisruns/finalizers", "experiments", "experiments/finalizers"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["analysistemplates", "clusteranalysistemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["", "apps"]
    resources: ["deployments", "podtemplates"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "patch", "create", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["networking.k8s.io", "extensions"]
    resources: ["ingresses"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules"]
    verbs: ["watch", "get", "update", "patch", "list"]
  - apiGroups: ["split.smi-spec.io"]
    resources: ["trafficsplits"]
    verbs: ["create", "watch", "get", "update", "patch"]
  - apiGroups: ["getambassador.io", "x.getambassador.io"]
    resources: ["mappings", "ambassadormappings"]
    verbs: ["create", "watch", "get", "update", "list", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
  - apiGroups: ["elbv2.k8s.aws", "eks.amazonaws.com"]
    resources: ["targetgroupbindings"]
    verbs: ["list", "get"]
  - apiGroups: ["appmesh.k8s.aws"]
    resources: ["virtualservices"]
    verbs: ["watch", "get", "list"]
  - apiGroups: ["appmesh.k8s.aws"]
    resources: ["virtualnodes", "virtualrouters"]
    verbs: ["watch", "get", "list", "update", "patch"]
  - apiGroups: ["traefik.containo.us", "traefik.io"]
    resources: ["traefikservices"]
    verbs: ["watch", "get", "update"]
  - apiGroups: ["apisix.apache.org"]
    resources: ["apisixroutes"]
    verbs: ["watch", "get", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-rollouts
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: hpdc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-rollouts
subjects:
  - kind: ServiceAccount
    name: argo-rollouts
    namespace: argo-rollouts

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-aggregate-to-admin
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: hpdc-platform
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - rollouts
      - rollouts/scale
      - rollouts/status
      - experiments
      - analysistemplates
      - clusteranalysistemplates
      - analysisruns
    verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-aggregate-to-edit
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: hpdc-platform
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - rollouts
      - rollouts/scale
      - rollouts/status
      - experiments
      - analysistemplates
      - clusteranalysistemplates
      - analysisruns
    verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-aggregate-to-view
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: hpdc-platform
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - rollouts
      - rollouts/scale
      - experiments
      - analysistemplates
      - clusteranalysistemplates
      - analysisruns
    verbs: ["get", "list", "watch"]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-rollouts-config
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: Secret
metadata:
  name: argo-rollouts-notification-secret
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: hpdc-platform
type: Opaque

---
apiVersion: v1
kind: Service
metadata:
  name: argo-rollouts-metrics
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: hpdc-platform
spec:
  ports:
    - name: metrics
      port: 8090
      protocol: TCP
      targetPort: 8090
  selector:
    app.kubernetes.io/name: argo-rollouts

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-rollouts
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-rollouts
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-rollouts
    spec:
      containers:
        - name: argo-rollouts
          image: quay.io/argoproj/argo-rollouts:v1.9.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 10
          ports:
            - name: metrics
              containerPort: 8090
            - name: healthz
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /home/argo-rollouts/plugin-bin
              name: plugin-bin
            - mountPath: /tmp
              name: tmp
      securityContext:
        runAsNonRoot: true
      serviceAccountName: argo-rollouts
      volumes:
        - name: plugin-bin
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-demo
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/name: rollout-demo
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rollout-demo
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {duration: 30s}
        - setWeight: 50
        - pause: {duration: 30s}
        - setWeight: 100

---
apiVersion: v1
kind: Service
metadata:
  name: rollout-demo
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/name: rollout-demo
    app.kubernetes.io/part-of: hpdc-platform
spec:
  selector:
    app: rollout-demo
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-demo
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/name: rollout-demo
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rollout-demo
  template:
    metadata:
      labels:
        app: rollout-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
