apiVersion: v1
kind: Namespace
metadata:
  name: casbin
  labels:
    app.kubernetes.io/name: casbin
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: casbin-rebac-policies
  namespace: casbin
  labels:
    app.kubernetes.io/name: casbin-rebac-policies
    app.kubernetes.io/part-of: hpdc-platform
data:
  relationships.csv: |
    subject,relation,object
    company:acme,admin,client:acme
    company:acme,admin,device:acme-dev-001
    company:acme,admin,asset:acme-asset-001
    client:acme,owns,device:acme-dev-001
  policy.csv: |
    p, company:acme:admin, *, *, allow
    p, client:acme, *, *, allow

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casbin-rebac-ext-authz
  namespace: casbin
  labels:
    app.kubernetes.io/name: casbin-rebac-ext-authz
    app.kubernetes.io/component: authz
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: casbin-rebac-ext-authz
      app.kubernetes.io/component: authz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casbin-rebac-ext-authz
        app.kubernetes.io/component: authz
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: casbin-rebac-ext-authz
          image: docker.io/casbin/ext-authz:v0.0.1
          imagePullPolicy: IfNotPresent
          args:
            - --policyPath
            - /policies
            - --relationshipPath
            - /relationships
          env:
            - name: CASBIN_POLICY_FORMAT
              value: csv
            - name: CASBIN_REBACKEND
              value: postgres
            - name: CASBIN_POLICY_LOG_LEVEL
              value: info
          ports:
            - name: grpc
              containerPort: 50052
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
            - name: relationships
              mountPath: /relationships
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: casbin-rebac-policies
        - name: relationships
          configMap:
            name: casbin-rebac-policies
