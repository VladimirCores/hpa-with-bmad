apiVersion: v1
kind: Namespace
metadata:
  name: casbin
  labels:
    app.kubernetes.io/name: casbin
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: casbin-policies
  namespace: casbin
  labels:
    app.kubernetes.io/name: casbin-policies
    app.kubernetes.io/part-of: hpdc-platform
data:
  roles.csv: |
    g, administrator, admin
    g, manager, admin
    g, operator, admin
    g, technic, operator
    g, developer, operator
    g, CEO, manager
    g, client, viewer
  policy.csv: |
    p, admin, *, *, allow
    p, manager, *, *, allow
    p, operator, *, *, allow
    p, viewer, *, *, deny

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casbin-ext-authz
  namespace: casbin
  labels:
    app.kubernetes.io/name: casbin-ext-authz
    app.kubernetes.io/component: authz
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: casbin-ext-authz
      app.kubernetes.io/component: authz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casbin-ext-authz
        app.kubernetes.io/component: authz
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: casbin-ext-authz
          image: docker.io/casbin/ext-authz:v0.0.1
          imagePullPolicy: IfNotPresent
          args:
            - --policyPath
            - /policies
          env:
            - name: CASBIN_POLICY_FORMAT
              value: csv
            - name: CASBIN_POLICY_LOG_LEVEL
              value: info
          ports:
            - name: grpc
              containerPort: 50051
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: casbin-policies

---
apiVersion: v1
kind: Service
metadata:
  name: casbin-ext-authz
  namespace: casbin
  labels:
    app.kubernetes.io/name: casbin-ext-authz
    app.kubernetes.io/component: authz
    app.kubernetes.io/part-of: hpdc-platform
spec:
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
  selector:
    app.kubernetes.io/name: casbin-ext-authz
    app.kubernetes.io/component: authz
