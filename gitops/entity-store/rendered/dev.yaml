apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: entity-store
    app.kubernetes.io/name: graphql-gateway
    app.kubernetes.io/part-of: hpdc-platform
    environment: dev
  name: graphql-gateway
  namespace: entity-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
      environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/component: entity-store
        app.kubernetes.io/name: graphql-gateway
        app.kubernetes.io/part-of: hpdc-platform
        environment: dev
    spec:
      containers:
      - args:
        - |
          mkdir -p /srv
          cat > /srv/echo.sh <<'SH'
          #!/bin/sh
          LINE=$(head -1)
          echo "$LINE" >&2
          while IFS= read -r H; do [ -z "$H" ] && break; echo "HDR: $H" >&2; done
          printf 'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nContent-Length: 2\r\nConnection: close\r\n\r\nOK'
          SH
          chmod +x /srv/echo.sh
          while true; do nc -l -p 8080 -e /srv/echo.sh; done
        command:
        - sh
        - -c
        image: docker.io/library/busybox:latest
        imagePullPolicy: IfNotPresent
        name: graphql-gateway
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          initialDelaySeconds: 2
          periodSeconds: 5
          tcpSocket:
            port: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/component: entity-store
    app.kubernetes.io/name: hpdc-graphql-gateway
    app.kubernetes.io/part-of: hpdc-platform
    environment: dev
  name: hpdc-graphql-gateway
  namespace: entity-store
spec:
  hostnames:
  - '*.hpdc.local'
  parentRefs:
  - name: hpdc-edge
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - backendRefs:
    - name: graphql-gateway
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /gql
---
apiVersion: hpdc.io/v1
kind: EntityChangeDedupe
metadata:
  labels:
    app.kubernetes.io/component: entity-store
    app.kubernetes.io/name: entity-change-dedupe
    app.kubernetes.io/part-of: hpdc-platform
    environment: dev
  name: entity-change-dedupe
  namespace: entity-store
spec:
  dedupe_key: source_change_id
  processed_window: 24h
  virtual_objects: restate
---
apiVersion: hpdc.io/v1
kind: EntityChangeFeed
metadata:
  labels:
    app.kubernetes.io/component: entity-store
    app.kubernetes.io/name: entity-change-feed
    app.kubernetes.io/part-of: hpdc-platform
    environment: dev
  name: entity-change-feed
  namespace: entity-store
spec:
  idempotency:
    deduplication: enabled
    key: source_change_id
  reaction_time_ms: 500
  retry_policy:
    automatic_retry: true
    dead_letter_queue: hpdc.entity.dead.letter
    max_attempts: 3
  sources:
  - couchdb._changes
  - yugabytedb.cdc
  workflow:
    exactly_once: true
    knative: true
    restate: true
---
apiVersion: hpdc.io/v1
kind: EntityCrud
metadata:
  labels:
    app.kubernetes.io/component: entity-store
    app.kubernetes.io/name: entity-crud-and-bulk-operations
    app.kubernetes.io/part-of: hpdc-platform
    environment: dev
  name: entity-crud-and-bulk-operations
  namespace: entity-store
spec:
  actor_validation:
    required: true
    unauthorized_response:
      http_status: 403
      record_attempt: true
  bulk_limit: 1000
  entity_types:
  - company
  - client
  - device
  - asset
  latency_budget_ms: 200
  mutation_logging:
    actor: required
    change_diff: required
    timestamp: required
  operations:
    bulk:
      roles:
      - oncall
      - platform-engineer
      - admin
    create:
      roles:
      - oncall
      - platform-engineer
      - admin
    delete:
      roles:
      - admin
    read:
      roles:
      - oncall
      - platform-engineer
      - admin
      - observer
    update:
      roles:
      - oncall
      - platform-engineer
      - admin
  retention:
    entries: 10000
    history_days: 90
  users:
    alice@hpdc: oncall
    bob@hpdc: platform-engineer
    carol@hpdc: admin
    dave@hpdc: observer
---
apiVersion: hpdc.io/v1
kind: EntityMutationAudit
metadata:
  labels:
    app.kubernetes.io/component: entity-store
    app.kubernetes.io/name: entity-mutation-audit
    app.kubernetes.io/part-of: hpdc-platform
    environment: dev
  name: entity-mutation-audit
  namespace: entity-store
spec:
  logging:
    actor: required
    change_diff: required
    timestamp: required
  retention:
    entries: 10000
    history_days: 90
---
apiVersion: hpdc.io/v1
kind: EntityStore
metadata:
  labels:
    app.kubernetes.io/component: entity-store
    app.kubernetes.io/name: entity-hierarchy-store
    app.kubernetes.io/part-of: hpdc-platform
    environment: dev
  name: entity-hierarchy-store
  namespace: entity-store
spec:
  stateful_storage:
    ceph_backed: true
    storage_class: hpdc-entity-ceph
  stores:
    arcadedb:
      graph_lineage: true
      relationship_data: true
    couchdb:
      document_crud: true
      document_hierarchy: true
    yugabytedb:
      internal_transactional_state: true
---
apiVersion: hpdc.io/v1
kind: HasuraGraphQL
metadata:
  labels:
    app.kubernetes.io/component: entity-store
    app.kubernetes.io/name: cross-store-entity-graphql
    app.kubernetes.io/part-of: hpdc-platform
    environment: dev
  name: cross-store-entity-graphql
  namespace: entity-store
spec:
  endpoint: /gql
  joins:
    clickhouse_telemetry: true
    couchdb_entities: true
    yugabytedb_resources: true
  latency_budget_ms: 2000
  permissions:
    role_model: configured
