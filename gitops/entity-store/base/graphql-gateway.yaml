apiVersion: hpdc.io/v1
kind: HasuraGraphQL
metadata:
  name: cross-store-entity-graphql
  namespace: entity-store
  labels:
    app.kubernetes.io/name: cross-store-entity-graphql
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: entity-store
spec:
  endpoint: /gql
  joins:
    couchdb_entities: true
    yugabytedb_resources: true
    clickhouse_telemetry: true
  latency_budget_ms: 2000
  permissions:
    role_model: configured

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: graphql-gateway-config
  namespace: entity-store
  labels:
    app.kubernetes.io/name: graphql-gateway-config
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: entity-store
data:
  endpoint: /gql
  joins: |
    - couchdb_entities
    - yugabytedb_resources
    - clickhouse_telemetry
  latency_budget_ms: "2000"
  role_model: configured

---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
  namespace: entity-store
  labels:
    app.kubernetes.io/name: graphql-gateway
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: entity-store
spec:
  selector:
    app.kubernetes.io/name: graphql-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: entity-store
  labels:
    app.kubernetes.io/name: graphql-gateway
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: entity-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-gateway
        app.kubernetes.io/part-of: hpdc-platform
        app.kubernetes.io/component: entity-store
    spec:
      containers:
        - name: graphql-gateway
          image: docker.io/library/busybox:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /srv
              cat > /srv/echo.sh <<'SH'
              #!/bin/sh
              CR=$(printf '\r')
              n=0
              while IFS= read -r L; do
                L=${L%$CR}
                [ $n -eq 0 ] && echo "REQ: $L" >&2 || echo "HDR: $L" >&2
                n=$((n+1))
                [ -z "$L" ] && break
              done
              printf 'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nContent-Length: 2\r\nConnection: close\r\n\r\nOK'
              SH
              chmod +x /srv/echo.sh
              while true; do nc -l -p 8080 -e /srv/echo.sh; done
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hpdc-graphql-gateway
  namespace: entity-store
  labels:
    app.kubernetes.io/name: hpdc-graphql-gateway
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: entity-store
spec:
  parentRefs:
    - name: hpdc-edge
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "*.hpdc.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /gql
      backendRefs:
        - name: graphql-gateway
          port: 8080
          weight: 1
