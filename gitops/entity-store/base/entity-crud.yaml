apiVersion: hpdc.io/v1
kind: EntityCrud
metadata:
  name: entity-crud-and-bulk-operations
  namespace: entity-store
  labels:
    app.kubernetes.io/name: entity-crud-and-bulk-operations
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: entity-store
spec:
  entity_types:
    - company
    - client
    - device
    - asset
  bulk_limit: 1000
  mutation_logging:
    actor: required
    timestamp: required
    change_diff: required
  latency_budget_ms: 200
  operations:
    create:
      roles: [oncall, platform-engineer, admin]
    read:
      roles: [oncall, platform-engineer, admin, observer]
    update:
      roles: [oncall, platform-engineer, admin]
    delete:
      roles: [admin]
    bulk:
      roles: [oncall, platform-engineer, admin]
  actor_validation:
    required: true
    unauthorized_response:
      http_status: 403
      record_attempt: true
  retention:
    entries: 10000
    history_days: 90
  users:
    alice@hpdc: oncall
    bob@hpdc: platform-engineer
    carol@hpdc: admin
    dave@hpdc: observer

---
apiVersion: hpdc.io/v1
kind: EntityMutationAudit
metadata:
  name: entity-mutation-audit
  namespace: entity-store
  labels:
    app.kubernetes.io/name: entity-mutation-audit
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: entity-store
spec:
  logging:
    actor: required
    timestamp: required
    change_diff: required
  retention:
    entries: 10000
    history_days: 90

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: entity-api
  namespace: entity-store
  labels:
    app.kubernetes.io/name: entity-api
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: entity-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: entity-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: entity-api
        app.kubernetes.io/part-of: hpdc-platform
        app.kubernetes.io/component: entity-store
    spec:
      serviceAccountName: entity-store
      containers:
        - name: entity-api
          image: hpdc.local/entity-api:0.1.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MUTATION_LOG_PATH
              value: /var/log/entity-store/mutations.ndjson
            - name: ENTITY_STORE_NS
              value: entity-store
          volumeMounts:
            - name: mutation-log
              mountPath: /var/log/entity-store
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mutation-log
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: entity-api
  namespace: entity-store
  labels:
    app.kubernetes.io/name: entity-api
    app.kubernetes.io/part-of: hpdc-platform
    app.kubernetes.io/component: entity-store
spec:
  selector:
    app.kubernetes.io/name: entity-api
  ports:
    - name: http
      port: 8080
      targetPort: http
