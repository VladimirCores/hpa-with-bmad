apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hpdc-edge-observability-ui-routes
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: hpdc-edge-observability-ui-routes
    app.kubernetes.io/part-of: hpdc-platform
  annotations:
    gateway.envoyproxy.io/native-auth: "true"
    gateway.envoyproxy.io/casbin-enforced: "false"
spec:
  parentRefs:
    - name: hpdc-edge
      sectionName: https
  hostnames:
    - "*.hpdc.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hubble
      backendRefs:
        - name: hubble-ui
          port: 80
          kind: Service
          weight: 1
