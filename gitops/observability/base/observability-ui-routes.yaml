apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-ui-routes
  namespace: observability
  labels:
    app.kubernetes.io/name: observability-ui-routes
    app.kubernetes.io/part-of: hpdc-platform
data:
  routes.yaml: |
    - name: grafana
      host: grafana.hpdc.local
      backend: grafana
      nativeAuth: true
      casbinEnforced: false
    - name: hubble
      host: hubble.hpdc.local
      backend: hubble-ui
      nativeAuth: true
      casbinEnforced: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-ui
  namespace: observability
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hubble-ui
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hubble-ui
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: hubble-ui
          image: docker.io/cilium/hubble-ui:v0.13.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: hpdc-platform
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: ui

---
apiVersion: v1
kind: Service
metadata:
  name: hubble-ui
  namespace: observability
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: hpdc-platform
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/component: ui
