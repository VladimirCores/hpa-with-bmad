apiVersion: v1
kind: Namespace
metadata:
  name: spegel
  labels:
    app.kubernetes.io/name: spegel
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spegel
  namespace: spegel
  labels:
    app.kubernetes.io/name: spegel
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spegel
  namespace: spegel
  labels:
    app.kubernetes.io/name: spegel
    app.kubernetes.io/part-of: hpdc-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spegel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spegel
    spec:
      serviceAccountName: spegel
      containers:
        - name: spegel
          image: ghcr.io/spegel-org/spegel:v0.7.4
          imagePullPolicy: IfNotPresent
          args:
            - --namespace=spegel
            - --registry=registry.k8s.io
            - --containerd-address=/run/containerd/containerd.sock
          ports:
            - name: registry
              containerPort: 7979
          volumeMounts:
            - name: containerd
              mountPath: /run/containerd
              readOnly: true

---
apiVersion: v1
kind: Service
metadata:
  name: spegel-registry
  namespace: spegel
  labels:
    app.kubernetes.io/name: spegel
    app.kubernetes.io/part-of: hpdc-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: spegel
  ports:
    - name: registry
      port: 7979
      targetPort: registry