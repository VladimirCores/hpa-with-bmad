---
apiVersion: v1
data:
  ALLOW_CREDENTIALS_OVER_HTTP: "false"
  ARGOCD_INTEGRATION_ENABLED: "true"
  ARGOCD_NAMESPACE: argocd
  ARGOCD_WATCH_ARGOCD_NAMESPACE_ONLY: "false"
  CACHE_BY_TAG_POLICY: Allow
  GIT_PUSH_INTEGRATION_POLICY: AlwaysRebase
  GITCLIENT_EMAIL: no-reply@kargo.io
  GITCLIENT_NAME: Kargo
  GITCLIENT_SIGNING_KEY_TYPE: gpg
  GITHUB_PUSH_MAX_REVISIONS: "10"
  GITHUB_PUSH_VERIFY_UNTRUSTED_COMMITS: "false"
  IMAGE_REGISTRY_RATE_LIMIT: "20"
  IS_DEFAULT_CONTROLLER: "true"
  KARGO_NAMESPACE: kargo
  LOG_FORMAT: CONSOLE
  LOG_LEVEL: INFO
  MAX_CONCURRENT_CONTROL_FLOW_RECONCILES: "4"
  MAX_CONCURRENT_PROMOTION_RECONCILES: "4"
  MAX_CONCURRENT_STAGE_RECONCILES: "4"
  MAX_CONCURRENT_WAREHOUSE_RECONCILES: "4"
  MAX_IMAGE_CACHE_ENTRIES: "100000"
  MIN_WAREHOUSE_RECONCILIATION_INTERVAL: 5m0s
  ROLLOUTS_CONTROLLER_INSTANCE_ID: ""
  ROLLOUTS_INTEGRATION_ENABLED: "true"
  SHARED_RESOURCES_NAMESPACE: kargo-shared-resources
  SYSTEM_RESOURCES_NAMESPACE: kargo-system-resources
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: kargo
    app.kubernetes.io/part-of: hpdc-platform
  name: kargo-controller
  namespace: kargo
---
apiVersion: v1
data:
  kargo.yaml: |
    apiVersion: kargo.akuity.io/v1beta1
    kind: Warehouse
    metadata:
      name: offline-gitops
      namespace: kargo
    spec:
      git:
        repoURL: git://git-mirror/git-mirror
        branch: main
      prune:
        maxAge: 24h
    ---
    apiVersion: kargo.akuity.io/v1beta1
    kind: Stage
    metadata:
      name: dev
      namespace: kargo
    spec:
      warehouse: offline-gitops
      promotionPolicy:
        manual: true
    ---
    apiVersion: kargo.akuity.io/v1beta1
    kind: Freight
    metadata:
      name: offline-dev
      namespace: kargo
    spec:
      commits:
        - id: offline-dev
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: kargo
    app.kubernetes.io/part-of: hpdc-platform
  name: kargo-dev-config
  namespace: kargo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: kargo
    app.kubernetes.io/part-of: hpdc-platform
  name: kargo-controller
  namespace: kargo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: kargo-controller
      app.kubernetes.io/name: kargo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kargo-controller
        app.kubernetes.io/name: kargo
    spec:
      containers:
      - args:
        - controller
        command:
        - /sbin/tini
        - --
        - /usr/local/bin/kargo
        envFrom:
        - configMapRef:
            name: kargo-controller
        image: ghcr.io/akuity/kargo:v1.11.2
        imagePullPolicy: IfNotPresent
        name: controller
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp-data
      serviceAccountName: kargo-controller
      volumes:
      - emptyDir: {}
        name: tmp-data
