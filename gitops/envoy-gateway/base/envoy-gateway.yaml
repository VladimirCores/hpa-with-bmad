kind: RoleBinding
metadata:
  name: hpdc-envoy-gateway-leader-election
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: hpdc-envoy-gateway
    app.kubernetes.io/part-of: hpdc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hpdc-envoy-gateway-leader-election
subjects:
  - kind: ServiceAccount
    name: envoy-gateway
    namespace: envoy-gateway-system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gateway-config
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-gateway-config
    app.kubernetes.io/part-of: hpdc-platform
data:
  envoy-gateway.yaml: |
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: EnvoyGateway
    gatewayControllerNamespace: envoy-gateway-system
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
      name: hpdc-envoy-gateway
      provider:
        type: Kubernetes
        kubernetes:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
    auth:
      xdsServer:
        accessLogging:
          format: json

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-gateway
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-gateway
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        control-plane: envoy-gateway
        app.kubernetes.io/name: envoy-gateway
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      serviceAccountName: envoy-gateway
      containers:
        - name: envoy-gateway
          image: docker.io/envoyproxy/gateway:v1.9.0
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --config-path=/config/envoy-gateway.yaml
          ports:
            - name: grpc
              containerPort: 18000
            - name: ratelimit
              containerPort: 18001
            - name: wasm
              containerPort: 18002
          env:
            - name: GATEWAY_API_RESTRICTED_GATEWAY
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: wasm-cache
              mountPath: /var/lib/eg/wasm
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            failureThreshold: 30
            periodSeconds: 1
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: envoy-gateway-config
        - name: certs
          secret:
            secretName: envoy-gateway
        - name: wasm-cache
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
  labels:
    control-plane: envoy-gateway
    app.kubernetes.io/name: envoy-gateway
    app.kubernetes.io/part-of: hpdc-platform
spec:
  type: ClusterIP
  selector:
    control-plane: envoy-gateway
    app.kubernetes.io/component: control-plane
  ports:
    - name: grpc
      port: 18000
      targetPort: 18000
    - name: ratelimit
      port: 18001
      targetPort: 18001
    - name: wasm
      port: 18002
      targetPort: 18002
    - name: metrics
      port: 19001
      targetPort: 19001

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: hpdc-envoy-proxy
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: hpdc-envoy-proxy
    app.kubernetes.io/part-of: hpdc-platform
spec: {}

---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: hpdc-envoy-gateway
  labels:
    app.kubernetes.io/name: hpdc-envoy-gateway
    app.kubernetes.io/part-of: hpdc-platform
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: hpdc-envoy-proxy
    namespace: envoy-gateway-system

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hpdc-edge
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: hpdc-edge
    app.kubernetes.io/part-of: hpdc-platform
spec:
  gatewayClassName: hpdc-envoy-gateway
  addresses:
  - type: IPAddress
    value: 10.6.0.1
  listeners:
  - name: http
    port: 80
    protocol: HTTP
  # HTTPS edge with HTTP->HTTPS redirect and hpdc-edge-tls termination.
  - name: https
    port: 443
    protocol: HTTPS
    scheme: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: hpdc-edge-tls
        kind: Secret
        group: ""
  # MQTT over TLS (telemetry ingestion).
  - name: mqtt
    port: 1884
    protocol: TLS
    tls:
      mode: Terminate
      certificateRefs:
      - name: hpdc-edge-tls
        kind: Secret
        group: ""
    - type: IPAddress
      value: ${HPDC_GATEWAY_IP}
  listeners:
    - name: https
      hostname: "*.hpdc.local"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: hpdc-edge-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: mqtt
      port: 1884
      protocol: TCP
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hpdc-edge-domain-routes
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: hpdc-edge-domain-routes
    app.kubernetes.io/part-of: hpdc-platform
  annotations:
    gateway.envoyproxy.io/rate-limit: '{"requestsPerUnit":1000,"unit":"minute"}'
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: hpdc-edge
      sectionName: https
  hostnames:
    - "*.hpdc.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /data
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          name: couchdb-entity-store
          namespace: entity-store
          port: 5984
          kind: Service
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ""
          name: knative
          port: 80
          kind: Service
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /events
      backendRefs:
        - group: ""
          name: kafka
          port: 9094
          kind: Service
          weight: 1

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hpdc-edge-couchdb-admin
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: hpdc-edge-couchdb-admin
    app.kubernetes.io/part-of: hpdc-platform
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: hpdc-edge
      sectionName: https
  hostnames:
    - "admin.hpdc.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /couchdb
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          name: couchdb-entity-store
          namespace: entity-store
          port: 5984
          kind: Service
          weight: 1

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-hpdc-edge-data-to-couchdb
  namespace: entity-store
  labels:
    app.kubernetes.io/name: allow-hpdc-edge-data-to-couchdb
    app.kubernetes.io/part-of: hpdc-platform
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Service
      name: couchdb-entity-store
