    app.kubernetes.io/part-of: hpdc-platform
    control-plane: envoy-gateway
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  ports:
  - name: grpc
    port: 18000
    targetPort: 18000
  - name: ratelimit
    port: 18001
    targetPort: 18001
  - name: wasm
    port: 18002
    targetPort: 18002
  - name: metrics
    port: 19001
    targetPort: 19001
  selector:
    app.kubernetes.io/component: control-plane
    control-plane: envoy-gateway
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: telemetry-ingestion
    app.kubernetes.io/name: pulsar-telemetry-ingestion
    app.kubernetes.io/part-of: hpdc-platform
  name: pulsar-telemetry-ingestion
  namespace: telemetry-ingestion
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  - name: grpc
    port: 6669
    protocol: TCP
    targetPort: grpc
  - name: mqtt
    port: 1884
    protocol: TCP
    targetPort: mqtt
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/name: envoy-gateway
    app.kubernetes.io/part-of: hpdc-platform
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane
      app.kubernetes.io/name: envoy-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/name: envoy-gateway
        app.kubernetes.io/part-of: hpdc-platform
        control-plane: envoy-gateway
    spec:
      containers:
      - args:
        - server
        - --config-path=/config/envoy-gateway.yaml
        env:
        - name: GATEWAY_API_RESTRICTED_GATEWAY
          value: "true"
        image: docker.io/envoyproxy/gateway:v1.9.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 20
        name: envoy-gateway
        ports:
        - containerPort: 18000
          name: grpc
        - containerPort: 18001
          name: ratelimit
        - containerPort: 18002
          name: wasm
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 1
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /certs
          name: certs
          readOnly: true
        - mountPath: /var/lib/eg/wasm
          name: wasm-cache
      serviceAccountName: envoy-gateway
      volumes:
      - configMap:
          name: envoy-gateway-config
        name: config
      - name: certs
        secret:
          secretName: envoy-gateway
      - emptyDir: {}
        name: wasm-cache
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  labels:
    app.kubernetes.io/name: hpdc-envoy-proxy
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-envoy-proxy
  namespace: envoy-gateway-system
spec: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  labels:
    app.kubernetes.io/name: hpdc-edge
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-edge
  namespace: envoy-gateway-system
spec:
  addresses:
  - type: IPAddress
    value: 172.18.0.2
  gatewayClassName: hpdc-envoy-gateway
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    hostname: '*.hpdc.local'
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: hpdc-edge-tls
      mode: Terminate
  - allowedRoutes:
      namespaces:
        from: Same
    name: mqtt
    port: 1884
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  labels:
    app.kubernetes.io/name: hpdc-envoy-gateway
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: hpdc-envoy-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gateway.envoyproxy.io/rate-limit: '{"requestsPerUnit":1000,"unit":"minute"}'
  labels:
    app.kubernetes.io/name: hpdc-edge-domain-routes
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-edge-domain-routes
  namespace: envoy-gateway-system
spec:
  hostnames:
  - '*.hpdc.local'
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: hpdc-edge
    sectionName: https
  rules:
  - backendRefs:
    - kind: Service
      name: couchdb-entity-store
      namespace: entity-store
      port: 5984
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /data
  - backendRefs:
    - group: ""
      kind: Service
      name: knative
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /api
  - backendRefs:
    - group: ""
      kind: Service
      name: kafka
      port: 9094
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /events
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gateway.envoyproxy.io/rate-limit: '{"requestsPerUnit":100000,"unit":"second"}'
  labels:
    app.kubernetes.io/component: telemetry-ingestion
    app.kubernetes.io/name: hpdc-telemetry-http-ingestion
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-telemetry-http-ingestion
  namespace: telemetry-ingestion
spec:
  hostnames:
  - '*.hpdc.local'
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: hpdc-edge
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      name: pulsar-standalone
      namespace: pulsar
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /telemetry
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  labels:
    app.kubernetes.io/name: allow-hpdc-edge-data-to-couchdb
    app.kubernetes.io/part-of: hpdc-platform
  name: allow-hpdc-edge-data-to-couchdb
  namespace: entity-store
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
    name: couchdb-entity-store
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  labels:
    app.kubernetes.io/component: telemetry-ingestion
    app.kubernetes.io/name: allow-hpdc-telemetry-http-to-pulsar
    app.kubernetes.io/part-of: hpdc-platform
  name: allow-hpdc-telemetry-http-to-pulsar
  namespace: pulsar
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: telemetry-ingestion
  to:
  - group: ""
    kind: Service
    name: pulsar-standalone
