apiVersion: v1
data:
  envoy-gateway.yaml: |
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: EnvoyGateway
    gatewayControllerNamespace: envoy-gateway-system
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
      name: hpdc-envoy-gateway
      provider:
        type: Kubernetes
        kubernetes:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
    auth:
      xdsServer:
        accessLogging:
          format: json
