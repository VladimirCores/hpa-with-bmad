apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: regional-sovereignty
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: http://10.6.0.1:9418/with-bmad.git
    targetRevision: HEAD
    path: gitops/regional-sovereignty/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: regional-sovereignty
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
