apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: telemetry-ingestion
    app.kubernetes.io/part-of: hpdc-platform
  name: telemetry-ingestion
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: telemetry-ingestion
    app.kubernetes.io/name: pulsar-telemetry-ingestion
    app.kubernetes.io/part-of: hpdc-platform
  name: pulsar-telemetry-ingestion
  namespace: telemetry-ingestion
---
apiVersion: v1
data:
  capacity.yaml: |
    default: 5000
    deviceTypes:
      actuator: 25000
      gateway: 10000
      sensor: 25000
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: telemetry-ingestion
    app.kubernetes.io/name: telemetry-ingestion-capacity
    app.kubernetes.io/part-of: hpdc-platform
  name: telemetry-ingestion-capacity
  namespace: telemetry-ingestion
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: telemetry-ingestion
    app.kubernetes.io/name: pulsar-telemetry-ingestion
    app.kubernetes.io/part-of: hpdc-platform
  name: pulsar-telemetry-ingestion
  namespace: telemetry-ingestion
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  - name: grpc
    port: 6669
    protocol: TCP
    targetPort: grpc
  - name: mqtt
    port: 1884
    protocol: TCP
    targetPort: mqtt
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  labels:
    app.kubernetes.io/component: telemetry-ingestion
    app.kubernetes.io/name: hpdc-telemetry-grpc-ingestion
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-telemetry-grpc-ingestion
  namespace: telemetry-ingestion
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: hpdc-edge
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: pulsar-telemetry-ingestion
      port: 6669
    matches:
    - ls: /hpdc.telemetry.v1.TelemetryService
      value: /hpdc.telemetry.v1.TelemetryService
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gateway.envoyproxy.io/rate-limit: '{"requestsPerUnit":100000,"unit":"second"}'
  labels:
    app.kubernetes.io/component: telemetry-ingestion
    app.kubernetes.io/name: hpdc-telemetry-http-ingestion
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-telemetry-http-ingestion
  namespace: telemetry-ingestion
spec:
  hostnames:
  - '*.hpdc.local'
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: hpdc-edge
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: pulsar-standalone
      namespace: pulsar
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /telemetry
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  labels:
    app.kubernetes.io/component: telemetry-ingestion
    app.kubernetes.io/name: hpdc-telemetry-mqtt-ingestion
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-telemetry-mqtt-ingestion
  namespace: telemetry-ingestion
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: hpdc-edge
    namespace: envoy-gateway-system
    sectionName: mqtt
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: pulsar-telemetry-ingestion
      port: 1884
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  labels:
    app.kubernetes.io/component: telemetry-ingestion
    app.kubernetes.io/name: allow-hpdc-telemetry-http-to-pulsar
    app.kubernetes.io/part-of: hpdc-platform
  name: allow-hpdc-telemetry-http-to-pulsar
  namespace: pulsar
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: telemetry-ingestion
  to:
  - group: ""
    kind: Service
    name: pulsar-standalone
