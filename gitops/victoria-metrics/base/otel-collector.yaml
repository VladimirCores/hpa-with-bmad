apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: victoria-metrics
  labels:
    app.kubernetes.io/name: otel-collector-config
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: hpdc-platform
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
      probabilistic_sampler:
        sampling_percentage: 25
        hash_seed: 42
    exporters:
      otlp/victoriametrics:
        endpoint: vminsert:8480
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [probabilistic_sampler, batch]
          exporters: [otlp/victoriametrics]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-sampling-config
  namespace: victoria-metrics
  labels:
    app.kubernetes.io/name: otel-sampling-config
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: hpdc-platform
data:
  sampling.yaml: |
    default: 25
    per_service:
      entity-api: 100
      graphql-gateway: 50
      alert-handler: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: victoria-metrics
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: otel-collector
        app.kubernetes.io/part-of: hpdc-platform
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:latest
          args:
            - --config=/etc/otel-collector/otel-collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector
          readinessProbe:
            httpGet:
              path: /
              port: otlp-http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: victoria-metrics
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: hpdc-platform
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
