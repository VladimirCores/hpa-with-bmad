apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: security
    app.kubernetes.io/part-of: hpdc-platform
  name: security
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: events-api-key
    app.kubernetes.io/part-of: hpdc-platform
  name: events-api-key
  namespace: security
stringData:
  events-key: hpdc-events-dev-key
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: telemetry-api-key
    app.kubernetes.io/part-of: hpdc-platform
  name: telemetry-api-key
  namespace: security
stringData:
  telemetry-key: hpdc-telemetry-dev-key
type: Opaque
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  labels:
    app.kubernetes.io/name: hpdc-graphql-gateway-jwt-authn
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-graphql-gateway-jwt-authn
  namespace: entity-store
spec:
  jwt:
    providers:
    - issuer: https://casdoor.hpdc.local
      name: casdoor-hpdc
      remoteJWKS:
        uri: https://casdoor.hpdc.local/.well-known/jwks.json
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: hpdc-graphql-gateway
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  labels:
    app.kubernetes.io/name: hpdc-messaging-api-key-authn
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-messaging-api-key-authn
  namespace: envoy-gateway-system
spec:
  apiKeyAuth:
    credentialRefs:
    - group: ""
      kind: Secret
      name: events-api-key
      namespace: security
    extractFrom:
      - headers:
        - X-API-Key
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: hpdc-edge-domain-routes
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  labels:
    app.kubernetes.io/name: hpdc-telemetry-grpc-api-key-authn
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-telemetry-grpc-api-key-authn
  namespace: telemetry-ingestion
spec:
  apiKeyAuth:
    credentialRefs:
    - group: ""
      kind: Secret
      name: telemetry-api-key
      namespace: security
    extractFrom:
      - headers:
        - X-API-Key
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: hpdc-telemetry-grpc-ingestion
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  labels:
    app.kubernetes.io/name: hpdc-telemetry-http-api-key-authn
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-telemetry-http-api-key-authn
  namespace: telemetry-ingestion
spec:
  apiKeyAuth:
    credentialRefs:
    - group: ""
      kind: Secret
      name: telemetry-api-key
      namespace: security
    extractFrom:
      - headers:
        - X-API-Key
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: hpdc-telemetry-http-ingestion