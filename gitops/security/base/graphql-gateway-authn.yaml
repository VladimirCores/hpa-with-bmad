apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hpdc-graphql-gateway-jwt-authn
  namespace: entity-store
  labels:
    app.kubernetes.io/name: hpdc-graphql-gateway-jwt-authn
    app.kubernetes.io/part-of: hpdc-platform
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hpdc-graphql-gateway
  jwt:
    providers:
      - name: casdoor-hpdc
        issuer: https://casdoor.hpdc.local
        audiences:
          - hpdc-graphql-gateway
        claimToHeaders:
          - claim: sub
            header: X-Casdoor-Subject
          - claim: name
            header: X-Casdoor-Username
        remoteJWKS:
          uri: http://casdoor.casdoor.svc.cluster.local:80/.well-known/jwks