    victoriametrics:
      components:
        - vmstorage
        - vminsert
        - vmselect
      retention:
        dev: 24h
        staging: 7d
        prod: configurable
  logs:
    vmlog: true
    search_within_seconds: 5
  traces:
    opentelemetry_collector: true
    backend: victoriametrics
  dashboards:
    grafana:
      platform_health: true
      telemetry_throughput: true
      alert_statistics: true
      business_metrics: true
  alertmanager:
    routing: configured
    stale_metric_warning_minutes: 5
