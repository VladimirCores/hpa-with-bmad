apiVersion: hpdc.io/v1
kind: ObservabilityPipeline
metadata:
  name: epic4-observability-pipeline
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: epic4-observability-pipeline
    app.kubernetes.io/part: epic-4
spec:
