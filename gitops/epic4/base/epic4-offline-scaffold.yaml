apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spin-functions-lag
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: spin-functions-lag
    app.kubernetes.io/part: epic-4
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spin-functions
  minReplicas: 1
  maxReplicas: 100
  metrics:
    - type: External
      external:
        metric:
          name: kafka_consumer_lag
        target:
          type: AverageValue
          averageValue: 10000
