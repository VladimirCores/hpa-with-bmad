apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-common-envelope
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: telemetry-common-envelope
    app.kubernetes.io/part: epic-4
data:
  schema.proto: |
    syntax = "proto3";
    package hpdc.telemetry.v1;

    message CommonEnvelope {
      string idempotency_key = 1;
      string device_id = 2;
      string device_type = 3;
      string event_type = 4;
      int64 timestamp = 5;
      bytes payload = 6;
      string region_id = 7;
      string origin = 8;
    }

    service TelemetryService {
      rpc PublishTelemetry(CommonEnvelope) returns (TelemetryAck);
    }

    message TelemetryAck {
      string idempotency_key = 1;
      bool accepted = 2;
      string error_code = 3;
      string error_message = 4;
    }
  compatibility: BACKWARD
  max_payload_bytes: "65536"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulsar-topic-policy
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: pulsar-topic-policy
    app.kubernetes.io/part: epic-4
data:
  topic_namespace: hpdc.telemetry
  default_partitions: "12"
  partition_keys: |
    device_type,region_id
  ordering_key: device_id
  retention:
    dev: 24h
    staging: 7d
    prod: configurable
  dead_letter_policy:
    max_redeliver_count: 3
  persistence:
    storage_class: hpdc-ceph
---
apiVersion: pulsar.streamnative.io/v1alpha1
kind: PulsarTopic
metadata:
  name: telemetry-normalized
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: telemetry-normalized
    app.kubernetes.io/part: epic-4
spec:
  topicType: partitioned
  partitions: 12
  properties:
    device_type: enabled
    region_id: enabled
    origin: enabled
  retention:
    dev: 24h
    staging: 7d
    prod: configurable
---
apiVersion: pulsar.streamnative.io/v1alpha1
kind: PulsarTopic
metadata:
  name: telemetry-normalized-dev
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: telemetry-normalized-dev
    app.kubernetes.io/part: epic-4
spec:
  topicType: partitioned
  partitions: 4
  properties:
    device_type: enabled
    region_id: enabled
    origin: enabled
  retention:
    dev: 24h
---
apiVersion: hpdc.io/v1
kind: TelemetryBackpressurePolicy
metadata:
  name: hpdc-telemetry-backpressure-policy
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: hpdc-telemetry-backpressure-policy
    app.kubernetes.io/part: epic-4
spec:
  max_consumer_lag: 50000
  max_buffer_bytes: 1073741824
  exponential_backoff:
    initial_ms: 50
    max_ms: 5000
    multiplier: 2
  drop_policy:
    drop_when_buffer_full: true
    reason_labels:
      consumer_lag: enabled
      buffer_full: enabled
      schema_error: enabled
  metrics:
    ingestion_dropped_total:
      labels:
        reason: enabled
        device_type: enabled
        region_id: enabled
  memory_ceiling:
    hard_limit_mb: 2048
    soft_limit_mb: 1536
---
apiVersion: hpdc.io/v1
kind: PulsarFunction
metadata:
  name: telemetry-windowed-aggregator
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: telemetry-windowed-aggregator
    app.kubernetes.io/part: epic-4
spec:
  source:
    subscriptionNamePrefix: telemetry-normalized
  runtime: JAVA
  user_config:
    aggregation_window: 500ms
    batch_size: 25000
    flush_interval_ms: 500
    dead_letter_queue: hpdc.telemetry.dead.letter
  retry_policy:
    max_retries: 3
  sink:
    type: jdbc
    database: clickhouse
    table: device_metrics
    flush_interval_ms: 500
    batch_size: 25000
    ack_path: jdbc_sink
---
apiVersion: hpdc.io/v1
kind: ClickHouseTable
metadata:
  name: device_metrics
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: device_metrics
    app.kubernetes.io/part: epic-4
spec:
  database: telemetry
  tableName: device_metrics
  template: |
    CREATE TABLE telemetry.device_metrics
    (
      device_type LowCardinality(String),
      region_id LowCardinality(String),
      device_id String,
      event_type String,
      processed_timestamp DateTime64(3, 'UTC'),
      message_timestamp DateTime64(3, 'UTC'),
      payload String,
      origin String,
      idempotency_key String,
      ingest_timestamp DateTime64(3, 'UTC') DEFAULT now64(3)
    )
    ENGINE = ReplacingMergeTree(ingest_timestamp)
    PARTITION BY toYYYYMM(processed_timestamp)
    ORDER BY (device_type, processed_timestamp)
  retention:
    dev: 24h
    staging: 7d
    prod: configurable
  storage:
    storage_class: hpdc-ceph
---
apiVersion: hpdc.io/v1
kind: KeyDBCache
metadata:
  name: hot-device-state-and-alert-context
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: hot-device-state-and-alert-context
    app.kubernetes.io/part: epic-4
spec:
  default_ttl_seconds: 300
  fallback_stores:
    - couchdb
    - clickhouse
    - yugabytedb
  cache_miss_policy:
    propagate_cache_errors: false
    fallback_timeout_ms: 100
  refresh_triggers:
    - telemetry
    - alert_state
    - entity_change
  metrics:
    cache_hit_total: enabled
    cache_miss_total: enabled
    cache_latency_ms_p99: enabled
---
apiVersion: hpdc.io/v1
kind: SpinWasmFunction
metadata:
  name: event-telemetry-transform
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: event-telemetry-transform
    app.kubernetes.io/part: epic-4
spec:
  topic: hpdc.telemetry.events
  function_type: filtering
  enrichment:
    region_id: enabled
    device_type: enabled
    origin: enabled
  field_mapping:
    device_id: device_id
    device_type: device_type
    event_type: event_type
    timestamp: timestamp
    payload: payload
    region_id: region_id
  scale:
    metric: kafka.consumer.lag
    target_lag_per_replica: 10000
  latency_budget_ms: 10
---
apiVersion: hpdc.io/v1
kind: AlertSignalStream
metadata:
  name: directed-alert-signals
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: directed-alert-signals
    app.kubernetes.io/part: epic-4
spec:
  topic: hpdc.alerts
  payload_fields:
    alert_id: required
    device_id: required
    severity: required
    timestamp: required
    metadata: required
  routing:
    separate_from_telemetry: true
  error_response:
    structured_http_error: true
---
apiVersion: hpdc.io/v1
kind: AlertStateMachine
metadata:
  name: alert-state-machine
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: alert-state-machine
    app.kubernetes.io/part: epic-4
spec:
  valid_path:
    - initial
    - acknowledged
    - investigating
    - resolved
    - closed
  persistence:
    couchdb: true
    keydb: true
  latency_targets:
    couchdb_write_ms: 100
    keydb_update_ms: 50
  invalid_transition_response:
    http_status: 409
    include_current_state: true
  audit:
    actor: required
    timestamp: required
    change_diff: required
---
apiVersion: hpdc.io/v1
kind: AlertResponseEngine
metadata:
  name: alert-response-engine
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: alert-response-engine
    app.kubernetes.io/part: epic-4
spec:
  device_communication_latency_ms: 200
  webhook_delivery_latency_ms: 500
  webhook_attempts: 3
  webhook_backoff: exponential
  workflow_start: required
  correlation_id: alert_id
  ai_suggestion_policy:
    low_confidence: escalate_to_manual_review
    sensitive_actions: require_human_approval
---
apiVersion: hpdc.io/v1
kind: AlertAuditTrail
metadata:
  name: alert-audit-trail
  namespace: hpdc-epic4
  labels:
    app.kubernetes.io/name: alert-audit-trail
    app.kubernetes.io/part: epic-4
spec:
