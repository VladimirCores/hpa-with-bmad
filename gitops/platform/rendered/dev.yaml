apiVersion: hpdc.io/v1
kind: AlertStateMachine
metadata:
  labels:
    app.kubernetes.io/name: alert-state-machine
    app.kubernetes.io/part: platform
    environment: dev
  name: alert-state-machine
  namespace: hpdc-platform
spec:
  audit:
    actor: required
    change_diff: required
    timestamp: required
  invalid_transition_response:
    http_status: 409
    include_current_state: true
  latency_targets:
    couchdb_write_ms: 100
    keydb_update_ms: 50
  persistence:
    couchdb: true
    keydb: true
  valid_path:
  - initial
  - acknowledged
  - investigating
  - resolved
  - closed
---
apiVersion: hpdc.io/v1
kind: ClickHouseTable
metadata:
  labels:
    app.kubernetes.io/name: device_metrics
    app.kubernetes.io/part: platform
    environment: dev
  name: device-metrics
  namespace: hpdc-platform
spec:
  database: telemetry
  retention:
    dev: 24h
    prod: configurable
    staging: 7d
  storage:
    storage_class: hpdc-ceph
  tableName: device_metrics
  template: |
    CREATE TABLE telemetry.device_metrics
    (
      device_type LowCardinality(String),
      region_id LowCardinality(String),
      device_id String,
      event_type String,
      processed_timestamp DateTime64(3, 'UTC'),
      message_timestamp DateTime64(3, 'UTC'),
      payload String,
      origin String,
      idempotency_key String,
      ingest_timestamp DateTime64(3, 'UTC') DEFAULT now64(3)
    )
    ENGINE = ReplacingMergeTree(ingest_timestamp)
    PARTITION BY toYYYYMM(processed_timestamp)
    ORDER BY (device_type, processed_timestamp)
---
