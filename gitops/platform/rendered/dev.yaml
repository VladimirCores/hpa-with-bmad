apiVersion: hpdc.io/v1
kind: TelemetryBackpressurePolicy
metadata:
  labels:
    app.kubernetes.io/name: hpdc-telemetry-backpressure-policy
    app.kubernetes.io/part: platform
    environment: dev
  name: hpdc-telemetry-backpressure-policy
  namespace: hpdc-platform
spec:
  drop_policy:
    drop_when_buffer_full: true
    reason_labels:
      buffer_full: enabled
      consumer_lag: enabled
      schema_error: enabled
  exponential_backoff:
    initial_ms: 50
    max_ms: 5000
    multiplier: 2
  max_buffer_bytes: 1073741824
  max_consumer_lag: 50000
  memory_ceiling:
    hard_limit_mb: 2048
    soft_limit_mb: 1536
  metrics:
    ingestion_dropped_total:
