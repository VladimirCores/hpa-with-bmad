apiVersion: v1
data:
  dead_letter_policy: |
    max_redeliver_count: 3
  default_partitions: "12"
  ordering_key: device_id
  partition_keys: |
    device_type,region_id
  persistence: |
    storage_class: hpdc-ceph
  retention: |
    dev: 24h
    staging: 7d
    prod: configurable
  topic_namespace: hpdc.telemetry
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: pulsar-topic-policy
    app.kubernetes.io/part: platform
    environment: dev
  name: pulsar-topic-policy
  namespace: hpdc-platform
---
apiVersion: v1
data:
  compatibility: BACKWARD
  max_payload_bytes: "65536"
  schema.proto: |
    syntax = "proto3";
    package hpdc.telemetry.v1;

    message CommonEnvelope {
      string idempotency_key = 1;
      string device_id = 2;
      string device_type = 3;
      string event_type = 4;
      int64 timestamp = 5;
      bytes payload = 6;
      string region_id = 7;
      string origin = 8;
    }

    service TelemetryService {
      rpc PublishTelemetry(CommonEnvelope) returns (TelemetryAck);
    }

    message TelemetryAck {
      string idempotency_key = 1;
      bool accepted = 2;
      string error_code = 3;
      string error_message = 4;
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: telemetry-common-envelope
