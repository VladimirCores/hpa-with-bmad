apiVersion: v1
kind: Namespace
metadata:
  name: rook-ceph
---
allowVolumeExpansion: true
apiVersion: v1
kind: StorageClass
metadata:
  labels:
    app.kubernetes.io/component: storage
    app.kubernetes.io/name: rook-ceph
    app.kubernetes.io/part-of: hpdc-platform
  name: rook-ceph-cephfs
parameters:
  clusterNamespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/node-publish-secret: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret: rook-csi-cephfs-node
  csi.storage.k8s.io/provisioner-secret: rook-csi-cephfs-provisioner
  fsName: rook-ceph
  pool: rook-ceph
provisioner: rook-ceph.rook.io/filesystem
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
allowVolumeExpansion: true
apiVersion: v1
kind: StorageClass
metadata:
  labels:
    app.kubernetes.io/component: storage
    app.kubernetes.io/name: rook-ceph
    app.kubernetes.io/part-of: hpdc-platform
  name: rook-ceph-rbd
parameters:
  clusterNamespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret: rook-csi-rbd-provisioner
  csi.storage.k8s.io/node-publish-secret: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret: rook-csi-rbd-node
  csi.storage.k8s.io/provisioner-secret: rook-csi-rbd-provisioner
  imageFeatures: layering
  imageFormat: "2"
  pool: rook-ceph
provisioner: rook-ceph.rook.io/block
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rook-ceph-osd
  namespace: rook-ceph
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/name: rook-ceph
    app.kubernetes.io/part-of: hpdc-platform
  name: rook-ceph-operator
  namespace: rook-ceph
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: operator
      app.kubernetes.io/name: rook-ceph
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator
        app.kubernetes.io/name: rook-ceph
    spec:
      containers:
      - env:
        - name: ROOK_CEPH_IMAGE
          value: quay.io/rook/ceph:v1.20.3
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/rook/ceph:v1.20.3
        imagePullPolicy: IfNotPresent
        name: rook-ceph-operator
      serviceAccountName: rook-ceph-operator
      tolerations:
      - operator: Exists
---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    allowUnsupported: true
    image: quay.io/rook/ceph:v1.20.3
  dashboard:
    enabled: true
    ssl: false
  dataDirHostPath: /var/lib/rook
  healthCheck:
    daemonHealth:
      mgr:
        disabled: false
      mon:
        disabled: false
      osd:
        disabled: false
    livenessProbe:
      disabled: false
    readinessProbe:
      disabled: false
  mgr:
    count: 1
  mon:
    allowMultiplePerNode: false
    count: 1
    store:
      type: bluestore
  network:
    podIP:
      serviceCIDR: 10.96.0.0/12
    provider: kubernetes
  storage:
    storageClassDeviceSets:
    - count: 1
      dataEmptyDir: false
      devices:
      - name: /dev/disk/by-id/qemu_talos-v1
      name: rook-ceph-dev-osd
      placement:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: Exists
      plan:
        replicas: 1
      portable: true
      preparePlacement:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: Exists
      size: 16G
