apiVersion: v1
kind: Namespace
metadata:
  name: rook-ceph
  labels:
    # Ceph daemons require hostNetwork/hostPath/privileged — exempt the
    # namespace from the cluster-wide baseline PodSecurity enforcement.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/rook/ceph:v1.20.6-root
    allowUnsupported: true
  dataDirHostPath: /var/lib/rook
  mon:
    count: 1
    allowMultiplePerNode: false
  mgr:
    count: 1
  dashboard:
    enabled: true
    ssl: false
  storage:
    useAllNodes: true
    useAllDevices: false
    # Workers carry a dedicated virtio data disk at /dev/vdb (talosctl
    # --disks virtio:10GiB,virtio:10GiB — second entry is worker-only).
    deviceFilter: vdb
  # host networking: single-node dev cluster on QEMU; multus not installed.
  network:
    provider: host
  healthCheck:
    daemonHealth:
      mon:
        disabled: false
      osd:
        disabled: false

