apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alerts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: http://git-mirror.git-mirror.svc.cluster.local:9418/with-bmad.git
    targetRevision: HEAD
    path: gitops/alerts/rendered
  destination:
    server: https://kubernetes.default.svc
    namespace: hpdc-alerts
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
