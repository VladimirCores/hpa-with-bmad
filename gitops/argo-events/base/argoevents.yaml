apiVersion: v1
kind: Namespace
metadata:
  name: argo-events
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-events-sa
  namespace: argo-events
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-events-aggregate-to-admin
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: hpdc-platform
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - sensors
      - sensors/finalizers
      - sensors/status
      - eventsources
      - eventsources/finalizers
      - eventsources/status
      - eventbus
      - eventbus/finalizers
      - eventbus/status
    verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-events-aggregate-to-edit
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: hpdc-platform
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - sensors
      - sensors/finalizers
      - sensors/status
      - eventsources
      - eventsources/finalizers
      - eventsources/status
      - eventbus
      - eventbus/finalizers
      - eventbus/status
    verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-events-aggregate-to-view
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: hpdc-platform
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - sensors
      - sensors/finalizers
      - sensors/status
      - eventsources
      - eventsources/finalizers
      - eventsources/status
      - eventbus
      - eventbus/finalizers
      - eventbus/status
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-events-role
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: hpdc-platform
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources:
      - sensors
      - sensors/finalizers
      - sensors/status
      - eventsources
      - eventsources/finalizers
      - eventsources/status
      - eventbus
      - eventbus/finalizers
      - eventbus/status
    verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "configmaps", "services", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-events-binding
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: hpdc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-events-role
subjects:
  - kind: ServiceAccount
    name: argo-events-sa
    namespace: argo-events

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-events-controller-config
  namespace: argo-events
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: hpdc-platform
data:
  controller-config.yaml: |
    eventBus:
      nats:
        versions:
          - version: 0.22.1
            natsStreamingImage: nats-streaming:0.22.1
            metricsExporterImage: natsio/prometheus-nats-exporter:0.8.0
        jetstream:
          settings: |
            max_memory_store: -1
            max_file_store: 1TB
          streamConfig: |
            maxMsgs: 50000
            maxAge: 168h
            maxBytes: -1
            replicas: 3
            duplicates: 300s
            retention: 0
            discard: 0
          versions:
            - version: latest
              natsImage: nats:2.10.29
              metricsExporterImage: natsio/prometheus-nats-exporter:0.14.0
              configReloaderImage: natsio/nats-server-config-reloader:0.14.0
              startCommand: /nats-server

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: argo-events
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controller-manager
  template:
    metadata:
      labels:
        app: controller-manager
    spec:
      containers:
        - name: controller-manager
          image: quay.io/argoproj/argo-events:v1.9.11
          imagePullPolicy: IfNotPresent
          args: ["controller"]
          env:
            - name: ARGO_EVENTS_IMAGE
              value: quay.io/argoproj/argo-events:v1.9.11
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 9731
          volumeMounts:
            - mountPath: /etc/argo-events
              name: controller-config-volume
      serviceAccountName: argo-events-sa
      volumes:
        - name: controller-config-volume
          configMap:
            name: argo-events-controller-config

---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: offline-gitops
  namespace: argo-events
  labels:
    app.kubernetes.io/name: offline-gitops
    app.kubernetes.io/part-of: hpdc-platform
spec:
  git:
    offline-gitops:
      repoURL: git://git-mirror/git-mirror
      branch: main

---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: offline-gitops
  namespace: argo-events
  labels:
    app.kubernetes.io/name: offline-gitops
    app.kubernetes.io/part-of: hpdc-platform
spec:
  dependencies:
    - name: offline-gitops
      eventSourceName:
        name: offline-gitops
      eventName: git
  triggers:
    - template:
        name: offline-gitops
        workflow:
          entrypoint: offline-gitops
          templates:
            - name: offline-gitops
              container:
                image: alpine:3.20
                command: [sh, -c]
                args: ["echo offline gitops event received"]

---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: offline-gitops
  namespace: argo-events
  labels:
    app.kubernetes.io/name: offline-gitops
    app.kubernetes.io/part-of: hpdc-platform
spec:
  entrypoint: offline-gitops
  templates:
    - name: offline-gitops
      container:
        image: alpine:3.20
        command: [sh, -c]
        args: ["echo offline workflow received"]
