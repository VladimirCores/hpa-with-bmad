apiVersion: v1
data:
  controller-config.yaml: |
    eventBus:
      nats:
        versions:
          - version: 0.22.1
            natsStreamingImage: nats-streaming:0.22.1
            metricsExporterImage: natsio/prometheus-nats-exporter:0.8.0
        jetstream:
          settings: |
            max_memory_store: -1
            max_file_store: 1TB
          streamConfig: |
            maxMsgs: 50000
            maxAge: 168h
            maxBytes: -1
            replicas: 3
            duplicates: 300s
            retention: 0
            discard: 0
          versions:
            - version: latest
              natsImage: nats:2.10.29
              metricsExporterImage: natsio/prometheus-nats-exporter:0.14.0
              configReloaderImage: natsio/nats-server-config-reloader:0.14.0
              startCommand: /nats-server
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: hpdc-platform
  name: argo-events-controller-config
  namespace: argo-events
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: hpdc-platform
  name: controller-manager
  namespace: argo-events
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controller-manager
  template:
    metadata:
      labels:
        app: controller-manager
    spec:
      containers:
      - args:
        - controller
        env:
        - name: ARGO_EVENTS_IMAGE
          value: quay.io/argoproj/argo-events:v1.9.11
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/argoproj/argo-events:v1.9.11
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 3
          periodSeconds: 3
        name: controller-manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 3
          periodSeconds: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 9731
        volumeMounts:
        - mountPath: /etc/argo-events
          name: controller-config-volume
      serviceAccountName: argo-events-sa
      volumes:
      - configMap:
          name: argo-events-controller-config
        name: controller-config-volume
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  labels:
    app.kubernetes.io/name: offline-gitops
    app.kubernetes.io/part-of: hpdc-platform
  name: offline-gitops
  namespace: argo-events
spec:
  git:
    offline-gitops:
      branch: main
      repoURL: git://git-mirror/git-mirror
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  labels:
    app.kubernetes.io/name: offline-gitops
    app.kubernetes.io/part-of: hpdc-platform
  name: offline-gitops
  namespace: argo-events
spec:
  dependencies:
  - eventName: git
    eventSourceName:
      name: offline-gitops
    name: offline-gitops
  triggers:
  - template:
      name: offline-gitops
      workflow:
        entrypoint: offline-gitops
        templates:
        - container:
            args:
            - echo offline gitops event received
            command:
            - sh
            - -c
            image: alpine:3.20
          name: offline-gitops
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  labels:
    app.kubernetes.io/name: offline-gitops
    app.kubernetes.io/part-of: hpdc-platform
  name: offline-gitops
  namespace: argo-events
spec:
  entrypoint: offline-gitops
  templates:
  - container:
      args:
      - echo offline workflow received
      command:
      - sh
      - -c
      image: alpine:3.20
    name: offline-gitops
