apiVersion: cilium.io/v2alpha1
kind: Cilium
metadata:
  labels:
    app.kubernetes.io/component: networking
    app.kubernetes.io/name: hpdc-cilium
    app.kubernetes.io/part-of: hpdc-platform
  name: cilium
  namespace: kube-system
spec:
  egressMasqueradeInterfaces: eth0
  ipam:
    mode: kubernetes
  k8sServiceProxy:
    enabled: false
  kubeProxyReplacement:
    enableOnAllNodes: true
  l2AnnouncementMode: true
  nodeSelector:
    kubernetes.io/os: linux
  operator:
    replicas: 1
  routingMode: tunnel
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  labels:
    app.kubernetes.io/component: networking
    app.kubernetes.io/name: hpdc-cilium
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-l2-announcement
  namespace: kube-system
spec:
  loadBalancerIPs: true
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  labels:
    app.kubernetes.io/component: networking
    app.kubernetes.io/name: hpdc-cilium
    app.kubernetes.io/part-of: hpdc-platform
  name: hpdc-lb-pool
  namespace: kube-system
spec:
  blocks:
  - cidr: 192.168.100.200/32
