apiVersion: v1
kind: Namespace
metadata:
  name: hpdc-mtls-test
  labels:
    app.kubernetes.io/name: hpdc-mtls-test
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtls-server
  namespace: hpdc-mtls-test
  labels:
    app.kubernetes.io/name: mtls-server
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mtls-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mtls-server
    spec:
      serviceAccountName: default
      containers:
        - name: server
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: mtls-server
  namespace: hpdc-mtls-test
  labels:
    app.kubernetes.io/name: mtls-server
    app.kubernetes.io/part-of: hpdc-platform
spec:
  selector:
    app.kubernetes.io/name: mtls-server
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtls-client
  namespace: hpdc-mtls-test
  labels:
    app.kubernetes.io/name: mtls-client
    app.kubernetes.io/part-of: hpdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mtls-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mtls-client
    spec:
      serviceAccountName: default
      containers:
        - name: client
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              sleep 10
              curl -fsS http://mtls-server.hpdc-mtls-test.svc.cluster.local/
              touch /tmp/mtls-ready
              sleep infinity
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/mtls-ready
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtls-client-ready
  namespace: hpdc-mtls-test
  labels:
    app.kubernetes.io/name: mtls-client
    app.kubernetes.io/part-of: hpdc-platform
data:
  ready: "true"
