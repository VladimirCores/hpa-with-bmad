# Cilium mutual authentication (mTLS) is enabled via Helm values in
# scripts/gitops/install_cilium_mtls_dev.py (authentication.mutual.spire.*).
# SPIRE server/agent manifests follow.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cilium-spire
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/part-of: hpdc-platform
    # SPIRE agent sockets (hostPath) + local-path helper pods require privileged PSA
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: cilium-spire
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-agent
  namespace: cilium-spire
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: hpdc-platform

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server-config
  namespace: cilium-spire
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: hpdc-platform
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      socket_path = "/run/spire/sockets/server/server.sock"
      trust_domain = "hpdc.local"
      data_dir = "/opt/spire/data"
      ca_subject = {
        country = ["US"]
        organization = ["HPDC"]
        common_name = "HPDC SPIRE CA"
      }
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/opt/spire/data/datastore.sqlite3"
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "hpdc-dev" = {
              use_token_review_api_validation = true
              service_account_allow_list = ["cilium-spire:spire-agent"]
            }
          }
        }
      }

      KeyManager "disk" {
        plugin_data {
          keys_path = "/opt/spire/data/keys.json"
        }
      }

      # Publishes the trust bundle into the "spire-bundle" ConfigMap so agents
      # can bootstrap securely.
      Notifier "k8sbundle" {
        plugin_data {
          namespace = "cilium-spire"
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: cilium-spire
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: hpdc-platform
spec:
  serviceName: spire-server
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cilium-spire
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cilium-spire
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: spire-server
      tolerations:
        - operator: Exists
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.15.3
          imagePullPolicy: IfNotPresent
          # image ENTRYPOINT already includes "run"; args are appended flags only
          args:
            - --config
            - /run/spire/config/server.conf
          env:
            - name: SERVER_TOKEN
              value: dev-server-token
          ports:
            - name: server
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: data
              mountPath: /opt/spire/data
            - name: sockets
              mountPath: /run/spire/sockets
      volumes:
        - name: config
          configMap:
            name: spire-server-config
        - name: sockets
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: cilium-spire
          app.kubernetes.io/component: server
          app.kubernetes.io/part-of: hpdc-platform
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: cilium-spire
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: hpdc-platform
spec:
  selector:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/component: server
  ports:
    - name: server
      port: 8081
      targetPort: 8081

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: cilium-spire
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: hpdc-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cilium-spire
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cilium-spire
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: spire-agent
      tolerations:
        - operator: Exists
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.15.3
          imagePullPolicy: IfNotPresent
          # image ENTRYPOINT already includes "run"; args are appended flags only
          args:
            - --config
            - /run/spire/config/agent.conf
          securityContext:
            privileged: true
          volumeMounts:
            - name: sockets
              mountPath: /run/spire/sockets
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: bundle
              mountPath: /run/spire/config/bundle
              readOnly: true
            - name: spire-agent-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: sockets
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: spire-agent-config
        - name: bundle
          configMap:
            name: spire-bundle
            optional: true
        - name: spire-agent-token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent-config
  namespace: cilium-spire
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: hpdc-platform
data:
  agent.conf: |
    agent {
      socket_path = "/run/spire/sockets/agent/agent.sock"
      trust_domain = "hpdc.local"
      server_address = "spire-server.cilium-spire.svc"
      server_port = "8081"
      trust_bundle_path = "/run/spire/config/bundle/bundle.crt"
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "hpdc-dev"
        }
      }

      KeyManager "memory" {
        plugin_data {}
      }

      WorkloadAttestor "k8s" {
        plugin_data {}
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "localhost"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
# k8s_psat use_token_review_api_validation requires the SPIRE server SA to
# perform TokenReview / SubjectAccessReview checks.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server-auth-delegator
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/part-of: hpdc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: cilium-spire
---
# Trust bundle destination; the k8sbundle Notifier updates this ConfigMap
# with bundle.pem on server startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-bundle
  namespace: cilium-spire
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/component: trust-bundle
    app.kubernetes.io/part-of: hpdc-platform
---
# Allows the k8sbundle Notifier to publish the trust bundle ConfigMap and
# lets k8s_psat token-review validation resolve the attesting agent's Pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-server-bundle
  namespace: cilium-spire
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/part-of: hpdc-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
# k8s_psat validation also resolves the attesting agent's Node object.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server-node-reader
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/part-of: hpdc-platform
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server-node-reader
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/part-of: hpdc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server-node-reader
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: cilium-spire
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-server-bundle
  namespace: cilium-spire
  labels:
    app.kubernetes.io/name: cilium-spire
    app.kubernetes.io/part-of: hpdc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spire-server-bundle
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: cilium-spire
