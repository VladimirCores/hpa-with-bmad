version: 1
provisioned:
  argocd:
    value: argocd
    version: 3.5.1
  argo-events:
    value: offline-gitops
    version: 1.9.11
  argo-rollouts:
    value: rollout-demo
    version: 1.9.1
  kargo:
    value: kargo
    version: 1.11.2
  git-mirror:
    value: git-mirror
  api-key-authn:
    notes:
    - 'hpdc-edge-domain-routes apiKeyAuth (X-API-Key, secretRef events-api-key): /data,
      /api, /events'
    - 'hpdc-telemetry-http-api-key-authn (X-API-Key, secretRef telemetry-api-key):
      /telemetry'
    - hpdc-telemetry-grpc-api-key-authn (telemetry-api-key store)
    - events-key authenticates only /events; telemetry-key authenticates only /telemetry
      (R-009)
  harbor-image-cache:
    value: harbor-2.15.2
    images:
    - name: harbor/harbor-core:v2.15.2
      source: output/harbor/images/harbor-core-v2.15.2
      digest: sha256:offline-core
      changed: false
    - name: harbor/harbor-registry:v2.15.2
      source: output/harbor/images/harbor-registry-v2.15.2
      digest: sha256:offline-registry
      changed: false
  envoy-gateway: {}
  casbin-rbac: {}
  casbin-rebac: {}
  casbin-abac: {}
  casdoor: {}
  cert-manager: {}
  infisical: {}
  openapi: {}
  backstage: {}
  tool-ui: {}
  observability-ui: {}
  telemetry-ingestion: {}
  telemetry-validation: {}
  cilium-mtls: {}
